<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Governance ledger</title>
<style>
/* One stylesheet, no font file, no image, nothing to fetch. Every colour is
   a custom property so the dark palette is a swap rather than a second set
   of rules, and every box uses logical properties so a right-to-left
   dictionary would need no CSS at all. */

:root {
  color-scheme: light dark;

  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  --gap: 1.5rem;
  --step: 0.35rem;
  --measure: 68ch;

  /* Light palette. Every ink/background pair below clears WCAG 2.2 AA at
     body size; the muted ink clears it too, so secondary text is readable
     rather than decorative. */
  --bg: #fbfbfa;
  --surface: #ffffff;
  --ink: #1a1a1a;
  --ink-muted: #55524d;
  --rule: #d3d0ca;
  --accent: #1f4f8b;
  --error: #8c1d1d;
  --warning: #6f4a00;
  --info: #2a4b7c;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181a;
    --surface: #1e2124;
    --ink: #ececec;
    --ink-muted: #b3b6b8;
    --rule: #34383c;
    --accent: #8fb8ef;
    --error: #f19a9a;
    --warning: #e2b871;
    --info: #9dbbe8;
  }
}

body[data-density="compact"] {
  --gap: 0.9rem;
  --step: 0.2rem;
}

* { box-sizing: border-box; }

html { background: var(--bg); }

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.55;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

code { font-family: var(--font-mono); font-size: 0.9em; }

[hidden] { display: none !important; }

.skip-link {
  position: absolute;
  inset-block-start: -4rem;
  inset-inline-start: var(--gap);
  z-index: 3;
  padding: 0.4rem 0.7rem;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--accent);
  transition: inset-block-start 120ms ease;
}

.skip-link:focus { inset-block-start: 0.5rem; }

/* Header ------------------------------------------------------------- */

.chrome {
  display: flex;
  flex-wrap: wrap;
  gap: var(--gap);
  align-items: flex-end;
  justify-content: space-between;
  padding: calc(var(--gap) * 1.2) var(--gap) var(--gap);
  border-block-end: 1px solid var(--rule);
}

.chrome h1 {
  margin: 0;
  font-size: 1.2rem;
  font-weight: 600;
  letter-spacing: 0.005em;
}

.tagline {
  margin: var(--step) 0 0;
  max-inline-size: var(--measure);
  color: var(--ink-muted);
  font-size: 0.9rem;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.9rem;
  align-items: center;
}

.group {
  display: flex;
  align-items: center;
  gap: 0.3rem;
}

.group .label {
  color: var(--ink-muted);
  font-size: 0.8rem;
}

.hint {
  margin: 0;
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: 0.78rem;
}

/* The mode chip. Design spec section 4 asks the header to carry a
   generated-at line or a static-mode notice; this is it, kept to one short
   line so the header stays a header. The footer keeps the full detail. */
.chip {
  display: inline-block;
  margin: var(--step) 0 0;
  padding: 0.1rem 0.45rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 2px;
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: 0.75rem;
}

button {
  font: inherit;
  font-size: 0.85rem;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 2px;
  padding: 0.25rem 0.55rem;
  cursor: pointer;
}

button[aria-pressed="true"] {
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}

/* Panel navigation ---------------------------------------------------- */

.panels {
  position: sticky;
  inset-block-start: 0;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  gap: 0.2rem;
  padding: 0.45rem var(--gap);
  background: var(--bg);
  border-block-end: 1px solid var(--rule);
}

.panels button {
  background: transparent;
  border-color: transparent;
  padding: 0.3rem 0.65rem;
}

.panels button[aria-selected="true"] {
  background: var(--surface);
  border-color: var(--rule);
  color: var(--accent);
  font-weight: 600;
}

/* Panels -------------------------------------------------------------- */

main { padding: var(--gap); }
main:focus { outline: none; }

.panel { max-inline-size: var(--measure); }

.panel h2 {
  margin: 0 0 var(--step);
  font-size: 1.05rem;
  font-weight: 600;
}

.empty {
  margin: 0 0 var(--gap);
  color: var(--ink-muted);
}

.reference {
  margin: 0 0 var(--gap);
}

.reference dt {
  margin-block-start: var(--step);
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 600;
}

.reference dd {
  margin: 0 0 var(--step);
  margin-inline-start: 0;
  color: var(--ink-muted);
}

/* Status blocks. Severity is carried by a glyph and a word as well as by
   the rule colour, so nothing depends on seeing the hue. */

.status {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.5rem;
  margin: 0 0 var(--gap);
  padding: 0.55rem 0.75rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-inline-start: 3px solid var(--rule);
}

.status .status-label {
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  font-size: 0.78rem;
}

.status .status-text { flex: 1 1 20ch; }

.status-error { border-inline-start-color: var(--error); }
.status-error .glyph,
.status-error .status-label { color: var(--error); }

.status-warning { border-inline-start-color: var(--warning); }
.status-warning .glyph,
.status-warning .status-label { color: var(--warning); }

.status-info { border-inline-start-color: var(--info); }
.status-info .glyph,
.status-info .status-label { color: var(--info); }

.keys {
  margin: 0;
  padding-inline-start: 1.2rem;
  color: var(--ink-muted);
}

.note {
  margin: 0 0 var(--step);
  color: var(--ink-muted);
  font-size: 0.85rem;
}

/* Indicator cards ------------------------------------------------------
   One card per overview indicator: glyph, count, label, and a note. The
   severity reaches the reader three ways -- shape, word, and hue -- so the
   card is still readable in greyscale (design spec section 7, acceptance
   item 3). Each card is a link to the panel that details it. */

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
  gap: 0.7rem;
  margin: 0 0 var(--gap);
  padding: 0;
  list-style: none;
}

.card {
  padding: 0.55rem 0.75rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-inline-start: 3px solid var(--rule);
}

.card-link {
  display: block;
  color: inherit;
  text-decoration: none;
}

.card-link:hover .card-label { text-decoration: underline; }

.card-count {
  font-family: var(--font-mono);
  font-size: 1.3rem;
  font-weight: 600;
}

.card-label {
  display: block;
  font-size: 0.9rem;
}

.card-note {
  margin: var(--step) 0 0;
  color: var(--ink-muted);
  font-size: 0.78rem;
}

.unavailable {
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: 0.95rem;
  font-weight: 600;
}

.card-error { border-inline-start-color: var(--error); }
.card-error .glyph,
.card-error .card-count { color: var(--error); }

.card-warning { border-inline-start-color: var(--warning); }
.card-warning .glyph,
.card-warning .card-count { color: var(--warning); }

.card-info { border-inline-start-color: var(--info); }
.card-info .glyph,
.card-info .card-count { color: var(--info); }

/* Filter bar ----------------------------------------------------------- */

.filters {
  position: sticky;
  inset-block-start: 3rem;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.3rem;
  margin: 0 0 var(--gap);
  padding: 0.4rem 0;
  background: var(--bg);
  border-block-end: 1px solid var(--rule);
}

.filter-label {
  color: var(--ink-muted);
  font-size: 0.8rem;
}

/* The active filter, said in words. One `f` key serves every listing panel
   (design spec section 4), so a panel showing four rows out of nine owes the
   reader the reason and a way out of it -- otherwise a bookmarked filter
   reads as a short ledger rather than as a filtered one. */

.filter-chip {
  display: inline-flex;
  align-items: baseline;
  gap: 0.25rem;
  max-inline-size: 100%;
  color: var(--ink-muted);
  font-size: 0.8rem;
}

.filter-count {
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: 0.78rem;
}

.filter-clear { font-size: 0.78rem; padding: 0.15rem 0.45rem; }

/* Tables ---------------------------------------------------------------
   The record panels are wide by nature, so a panel that carries one opts
   out of the prose measure rather than squeezing six columns into 68ch.
   Below the breakpoint further down, these same rows fold into cards. */

.panel[data-wide="true"] { max-inline-size: none; }

.panel h3 {
  margin: var(--gap) 0 var(--step);
  font-size: 0.95rem;
  font-weight: 600;
}

.grid-table {
  inline-size: 100%;
  margin: 0 0 var(--gap);
  border-collapse: collapse;
  font-size: 0.9rem;
}

.grid-table caption {
  margin-block-end: var(--step);
  color: var(--ink-muted);
  font-size: 0.8rem;
  text-align: start;
}

.grid-table th,
.grid-table td {
  padding: 0.35rem 0.6rem;
  text-align: start;
  vertical-align: top;
  border-block-end: 1px solid var(--rule);
}

.grid-table th {
  color: var(--ink-muted);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

/* The severity rule sits on the row's first cell rather than on the row:
   under border-collapse a `tr` border is not painted reliably, and the
   first cell is the inline-start edge in either writing direction. */
.row-error > td:first-child { border-inline-start: 3px solid var(--error); }
.row-warning > td:first-child { border-inline-start: 3px solid var(--warning); }
.row-info > td:first-child { border-inline-start: 3px solid var(--info); }
.row-focus > td:first-child { border-inline-start-width: 7px; }

/* Canonical vocabulary --------------------------------------------------
   Design spec section 5: the token stays English and mono, the gloss is
   the translated tooltip, and the glyph carries the severity. */

.vocab {
  display: inline-flex;
  align-items: baseline;
  gap: 0.25rem;
  white-space: nowrap;
}

.vocab code { font-weight: 600; }

.vocab-error .glyph,
.vocab-error code { color: var(--error); }

.vocab-warning .glyph,
.vocab-warning code { color: var(--warning); }

.vocab-info .glyph,
.vocab-info code { color: var(--info); }

.marker {
  display: inline-flex;
  align-items: baseline;
  gap: 0.25rem;
  color: var(--warning);
  font-size: 0.8rem;
  font-weight: 600;
}

.evidence {
  margin: 0;
  padding-inline-start: 1.1rem;
}

/* Actions ---------------------------------------------------------------
   Design spec section 12.2. A file: page cannot run a command, so these are
   not controls that act -- they are controls that hand the reader something
   to paste. They are deliberately quiet: smaller than the chrome's own
   buttons, laid out in a row that wraps, and never the first thing a panel
   offers. The one exception is the Open link, which is a real anchor and is
   styled to look like the buttons beside it so a row of actions reads as
   one group rather than as a button, a button, and a link. */

.actions-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.3rem;
  margin-block-start: var(--step);
}

.action { font-size: 0.78rem; padding: 0.15rem 0.45rem; }

a.action {
  display: inline-block;
  color: var(--accent);
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 2px;
  text-decoration: none;
}

a.action:hover { text-decoration: underline; }

/* A control whose guard has not been satisfied yet. The attribute is the
   appearance; the refusal itself is in the handler (see rollbackActions),
   so this rule is allowed to be purely cosmetic. */
button.action[aria-disabled="true"] {
  opacity: 0.55;
  cursor: not-allowed;
}

.confirm-step {
  margin-block-start: var(--step);
  padding: var(--step) 0.5rem;
  border-inline-start: 3px solid var(--warning);
  background: var(--bg);
}

.confirm { border-color: var(--warning); color: var(--warning); }

/* The action queue (design spec section 12.2). A drawer rather than a
   panel: it is a scratch list, it lives only in this tab's memory, and it
   should not compete with the ledger for the reader's attention. */

.queue { padding: 0 var(--gap); }

.queue-drawer {
  border: 1px solid var(--rule);
  border-radius: 2px;
  padding: 0.35rem 0.6rem;
  background: var(--surface);
}

.queue-drawer summary { cursor: pointer; font-size: 0.85rem; font-weight: 600; }

.queue-body { margin-block-start: var(--step); }

.queue-list {
  margin: 0 0 var(--step);
  padding-inline-start: 1.4rem;
  font-family: var(--font-mono);
  font-size: 0.82rem;
}

/* The manual copy tier (build spec section 1.4). Always the same box, always
   holding exactly what the last action produced, so a browser with no
   clipboard API at all still leaves the reader something to select. */

.copybox {
  margin: var(--step) var(--gap) 0;
  padding: 0.35rem 0.6rem;
  border: 1px solid var(--accent);
  border-radius: 2px;
  background: var(--surface);
}

.copybox-label { margin: 0 0 var(--step); font-size: 0.85rem; font-weight: 600; }

.copybox-text {
  inline-size: 100%;
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: 2px;
  padding: 0.3rem;
  resize: vertical;
}

/* The announcement. Visible as well as announced: a reader watching the
   button they just pressed should not have to take a screen reader's word
   for what happened. */
.live {
  margin: var(--step) 0 0;
  padding: 0 var(--gap);
  color: var(--ink-muted);
  font-size: 0.85rem;
  min-block-size: 1.2rem;
}

/* Command palette (design spec section 4) -------------------------------
   Ctrl/Cmd+K over every record id, title, anchor, baseline item, and
   configuration key in the payload. It is a dialog rather than a panel
   because it interrupts: it takes the focus, it gives the focus back, and
   while it is open Tab does not leave it.

   The backdrop is opaque rather than translucent on purpose. A dimmed
   ledger behind a search box invites a click on a row that is not
   reachable; an opaque one says the page is busy, which is what
   aria-modal already tells a screen reader. */

.palette {
  position: fixed;
  inset: 0;
  z-index: 4;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 1.5rem 0.6rem;
  background: var(--bg);
  overflow-y: auto;
}

.palette-box {
  inline-size: min(38rem, 100%);
  padding: 0.75rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 2px;
}

.palette-title { margin: 0 0 var(--step); font-size: 1.05rem; font-weight: 600; }

.palette-label {
  display: block;
  margin-block-end: var(--step);
  color: var(--ink-muted);
  font-size: 0.85rem;
}

.palette-input {
  inline-size: 100%;
  font: inherit;
  font-size: 0.9rem;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: 2px;
  padding: 0.35rem 0.5rem;
}

.palette-count {
  margin: var(--step) 0;
  color: var(--ink-muted);
  font-size: 0.8rem;
}

.palette-results {
  margin: 0 0 var(--step);
  padding: 0;
  list-style: none;
}

.palette-result {
  display: block;
  inline-size: 100%;
  margin-block-end: 0.15rem;
  text-align: start;
  font-size: 0.82rem;
  overflow-wrap: anywhere;
}

.palette-panel { color: var(--ink-muted); font-size: 0.75rem; }

.palette-empty { margin: 0 0 var(--step); color: var(--ink-muted); font-size: 0.85rem; }

/* An evidence source is frequently a URL, and it is rendered as text on
   purpose (design spec section 1.3): it wraps anywhere so a long one does
   not push the table wider than the viewport. An anchor and a digest get the
   same treatment for the same reason -- both are long, both are copied more
   often than they are read. */
.source,
.path,
.digest {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  overflow-wrap: anywhere;
}

/* Run blocks ------------------------------------------------------------
   The Changes and Rollback panels list runs rather than rows: a run carries
   a header, a set of targets, and -- in Rollback -- four labelled sets, none
   of which fit one table row. The severity rule sits on the block's
   inline-start edge, the same treatment an indicator card gets, so the two
   panels agree with the cards about which colour means what. */

.run {
  margin: 0 0 var(--gap);
  padding: 0.55rem 0.75rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-inline-start: 3px solid var(--rule);
}

.run h3 { margin-block-start: 0; }

.run-error { border-inline-start-color: var(--error); }
.run-warning { border-inline-start-color: var(--warning); }
.run-info { border-inline-start-color: var(--info); }

.panel h4 {
  margin: var(--gap) 0 var(--step);
  color: var(--ink-muted);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

/* Provenance chains -----------------------------------------------------
   One native `details` per target: it opens with a click or with Enter, it
   is in the tab order without a line of script, and it needs no ARIA. The
   print block below unfolds them, because a collapsed chain would print as
   its summary and the PDF would carry a Provenance panel with no
   provenance in it. */

.chain {
  margin: 0 0 var(--step);
  padding: 0.35rem 0.6rem;
  background: var(--surface);
  border: 1px solid var(--rule);
}

.chain summary { cursor: pointer; }

.chain-body { margin-block-start: var(--step); }

.chain-list {
  margin: 0 0 var(--step);
  padding-inline-start: 1.2rem;
  color: var(--ink-muted);
}

/* Footer -------------------------------------------------------------- */

footer {
  margin-block-start: calc(var(--gap) * 2);
  padding: var(--gap);
  border-block-start: 1px solid var(--rule);
  color: var(--ink-muted);
  font-size: 0.85rem;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.2rem 1.75rem;
  margin: 0;
}

.meta div { display: flex; gap: 0.4rem; }
.meta dt { font-weight: 600; }
.meta dd { margin: 0; margin-inline-start: 0; font-family: var(--font-mono); }

/* Narrow widths. The document is a single column already; below the
   breakpoint the tables Tasks 4-5 add fold into labelled cards, and the
   panel bar stops sticking so it never eats a short viewport. */

@media (max-width: 720px) {
  :root { --gap: 1rem; }

  .chrome { align-items: flex-start; }
  .panels { position: static; }
  .filters { position: static; }
  .cards { grid-template-columns: 1fr; }

  .grid-table thead {
    position: absolute;
    inline-size: 1px;
    block-size: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }

  .grid-table tr {
    display: block;
    margin-block-end: var(--gap);
    padding: 0.5rem;
    border: 1px solid var(--rule);
  }

  .grid-table td {
    display: flex;
    gap: 0.75rem;
    justify-content: space-between;
    padding: 0.1rem 0;
    border: 0;
  }

  .grid-table td::before {
    content: attr(data-label);
    color: var(--ink-muted);
    font-weight: 600;
  }

  /* 360px. The filter bar and the palette are the two pieces of chrome a
     narrow viewport can push wider than itself: the bar because its chip
     carries an anchor, which is long and unbreakable at a space, and the
     palette because its results carry the same. Both wrap, both break
     inside a word, and the palette's box gives up its side padding so the
     text is not squeezed into a column. Nothing else here is allowed to
     scroll sideways -- the digest tooltip further up is the one exception
     the design spec grants. */
  .filters { row-gap: 0.2rem; }
  .filter-chip code { overflow-wrap: anywhere; }
  .palette { padding: 0.75rem 0.35rem; }
  .palette-box { padding: 0.5rem; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Print: black on white, no controls, every panel in document order so the
   PDF is the whole ledger rather than whichever tab was open.

   Print correctness requires every panel section to be populated on every
   render, not just the active one: this block unhides all nine, and it can
   only unhide what already has content in it. Do not optimize renderPanels
   to render the active panel only -- the printed ledger would silently lose
   eight of its nine sections, and no test that inspects the screen would
   notice. The same warning sits on renderPanels itself. */

@media print {
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --ink: #000000;
    --ink-muted: #2b2b2b;
    --rule: #8a8a8a;
    --accent: #000000;
    --error: #000000;
    --warning: #000000;
    --info: #000000;
  }

  /* Controls do not print. An action button on paper is a button nobody
     can press, and the queue and the copy box are scratch state rather than
     ledger content -- printing them would put a half-finished list of
     instructions into a document meant to be the record. */
  .skip-link,
  .panels,
  .filters,
  .actions,
  .actions-row,
  .queue,
  .copybox,
  .palette,
  .live { display: none !important; }

  body { background: #ffffff; color: #000000; font-size: 11pt; }
  main { padding: 0; }

  /* Black on white, enforced rather than inherited. The variables above
     already resolve to black and white, but a surface or a chip that ever
     acquires a literal colour would print it; these two rules mean the
     printed ledger stays legible on a monochrome printer whatever the
     screen palette does. */
  .card,
  .chain,
  .chip,
  .copybox-text,
  .queue-drawer,
  .run,
  .status {
    background: #ffffff;
    color: #000000;
  }

  .panel[hidden] { display: block !important; }

  .panel {
    max-inline-size: none;
    margin-block-end: 1.5rem;
    break-inside: avoid;
  }

  /* A run block or a table row split across a page break is a record that
     reads as two half-records. `page-break-inside` beside `break-inside`
     because print engines are behind the rest of the platform here and the
     older property is the one several of them still honour. */
  .run,
  .card,
  .status,
  .grid-table tr {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .grid-table { break-inside: auto; page-break-inside: auto; }
  .grid-table thead { display: table-header-group; }

  /* The same failure mode as the hidden panels above, one level down: the
     Provenance panel is nothing but collapsed `details`, so a printed ledger
     would carry that panel's heading and none of its chains. Two rules
     because engines hide the closed content two different ways -- older ones
     by not laying the children out at all, current Chromium by putting
     `content-visibility: hidden` on the generated content box -- and an
     engine that knows neither selector ignores both, which is exactly where
     it started. `open` is deliberately not set instead: it would unfold
     every chain on screen too, and the panel would stop being a list. */
  details > *:not(summary) { display: block !important; }
  details::details-content { content-visibility: visible !important; }

  .chain { break-inside: avoid; }
  .chain summary { list-style: none; font-weight: 600; }
}
</style>
</head>

<script>
/* The shell.

   Three rules hold this file together, and the static suite
   (dashboard/tests/test_shell.py) pins all three by reading this source
   rather than by rendering it:

   1. Ledger content enters through exactly one place, the JSON island above,
      and leaves through exactly one place, h() below. Text always lands as a
      text node or a textContent assignment. No markup is ever assembled from
      a string, which is why none of the DOM sinks the suite greps for
      appears anywhere in this file -- not in code, and not in these comments
      either, since that grep is deliberately unconditional.

   2. Every user-visible string comes from the dictionaries. The one
      exception is LAST_RESORT, which exists precisely for the case where the
      dictionaries cannot be read.

   3. The page asks for nothing. No fetch, no image, no font, no timer that
      takes a string. Opening this file offline and opening it online produce
      the same document. */

(function () {
  "use strict";

  var PAYLOAD_SCHEMA = 1;

  /* Panel order is the reading order of the whole tool: what happened, what
     exists, what changed, where it came from, how to undo it, what was
     deferred, what was decided, what it rests on, how to read any of it. */
  const PANELS = [
    "overview",
    "inventory",
    "changes",
    "provenance",
    "rollback",
    "backlog",
    "decisions",
    "materials",
    "help"
  ];

  var DEFAULT_PANEL = "overview";
  var FALLBACK_LANG = "en";
  var STALE_AFTER_DAYS = 7;
  var DAY_MS = 86400000;
  var DENSITIES = ["comfortable", "compact"];
  var STORE_LANG = "aio.lang";
  var STORE_DENSITY = "aio.density";

  /* How many palette matches are drawn at once. The count the reader is
     told is the true one; this only bounds the list, so a search for "a"
     against a large ledger stays a list rather than a second document --
     and stays usable at 360px, where twenty rows is already a scroll. */
  var PALETTE_RESULTS = 20;

  /* Which panel shows a record of each type. The palette's whole promise is
     that pressing Enter lands somewhere the match is actually visible, and
     that is a different panel for each of the five record types. */
  var PALETTE_PANELS = {
    MATERIAL: "materials",
    PROPOSAL: "provenance",
    RUN: "changes",
    ADR: "decisions",
    BASELINE: "inventory"
  };

  /* The canonical vocabulary, English on screen in every language (design
     spec section 5). Held here as data so the Help panel and the Task 4-5
     renderers name the same eight states from one list. */
  var DRIFT_STATES = ["IN_PLACE", "DRIFTED", "REVERTED", "MISSING", "UNVERIFIABLE"];
  var ROLLBACK_INDICATORS = ["HEALTHY", "AT_RISK", "BROKEN"];

  /* Functional glyphs, not decoration: severity must be legible without
     colour (design spec section 7, acceptance item 3), so every status
     carries a shape and a word as well as a hue. */
  var GLYPHS = { error: "✕", warning: "▲", info: "●" };

  /* Severity, worst first. The rank *is* the index, so this array is the
     whole ordering rule: there is no second list anywhere in this file, and
     `sortBySeverityThenRecency` is the one place it is applied. */
  var SEVERITY_ORDER = ["error", "warning", "info"];

  /* The five drift states as severities. DRIFTED and MISSING both mean this
     ledger no longer describes what is on disk, which is precisely the
     finding the drift machinery exists to surface; UNVERIFIABLE means nobody
     could tell, which is a warning rather than a failure; the other two are
     the quiet outcomes. Mapping a drifted item to `info` would sort it below
     a note and paint it like one -- a silent downgrade. */
  var DRIFT_SEVERITY = {
    IN_PLACE: "info",
    DRIFTED: "error",
    REVERTED: "info",
    MISSING: "error",
    UNVERIFIABLE: "warning"
  };

  /* The three rollback indicators, same three words. */
  var INDICATOR_SEVERITY = {
    HEALTHY: "info",
    AT_RISK: "warning",
    BROKEN: "error"
  };

  /* The exact four keys `rollback_preview`'s report carries for design spec
     section 11's four sets, in the order they render. This is the whole
     contract between this file and `ledgerlib/rollback.py`: declared once,
     as data, so a test can read it out of this source and compare it
     against a live report's own keys rather than against a second
     hand-typed copy that could drift from either side unnoticed. A rename
     on either end -- here, or in the report `rollback_preview` builds --
     leaves the two lists disagreeing and fails
     `dashboard/tests/test_rollback.py`'s contract test. */
  var PREVIEW_SETS = [
    "will_be_restored", "cannot_be_restored", "will_not_change", "residual_effects"
  ];

  /* Per set: the label this page shows it under, and whether that set's
     rows carry a reason worth a second line (`cannot_be_restored` alone
     does -- a target the preview could not restore always says why). Keyed
     by `PREVIEW_SETS`' own literal strings, never by anything the ledger
     supplies, so this is a plain object rather than an `own()`-guarded one. */
  var PREVIEW_SET_META = {
    will_be_restored: { labelKey: "rollback.restorable", withReason: false },
    cannot_be_restored: { labelKey: "rollback.cannot_restore", withReason: true },

        t("filter.count") + " " + String(shown) + "/" + String(total)

      bar.appendChild(clearFilterButton(state));
    }
    return bar;
  }

  /* Appends the bar when there is one, and -- when the filter emptied the
     panel -- the instructional line that says so. A blank panel under an
     active filter reads as "there is nothing here", which is the one thing
     it does not mean. */
  function appendFilters(section, state, panel, shown, total, values, labelKey) {
    appendAll(section, [panelFilters(state, panel, shown, total, values, labelKey)]);
    if (state.f !== "" && shown === 0) {
      section.appendChild(h("p", { class: "empty" }, t("filter.empty")));
      return false;
    }
    return true;
  }

  function filterButton(state, value, label) {
    var node = h(
      "button",
      { type: "button", "aria-pressed": String(state.f === value) },
      label
    );
    node.addEventListener("click", function () {
      goTo({ panel: state.panel, lang: state.lang, f: value }, true);
    });
    return node;
  }

  function clearFilterButton(state) {
    var node = h(
      "button",
      { type: "button", class: "filter-clear" },
      t("filter.clear")
    );
    node.addEventListener("click", function () {
      goTo({ panel: state.panel, lang: state.lang, f: "" }, true);
    });
    return node;
  }

  /* Actions -------------------------------------------------------------
     Design spec section 12.2, under build spec section 1.4's rule. A
     file: page cannot run a command, write a file, or speak to the agent,
     so nothing here acts: every control produces text for a person to
     paste, and the whole security question is which text.

     The answer is: one of four fixed English sentences, plus a record id
     this file matched against a pattern of its own, and nothing else --
     no title, no reason, no anchor, no field of any record. A material is
     an untrusted document; a clipboard is a place people paste without
     reading; an instruction assembled from a material's own words would be
     the shortest path there is from "someone wrote a hostile title" to
     "the agent was told to do something nobody asked for".

     Four properties carry that, and each one is pinned by a test:

       1. TEMPLATES is frozen, so no later code can add a fifth entry, and
          null-prototype, so an action of "constructor" reads back
          undefined rather than the inherited function.
       2. ID_RE's source appears exactly once in this file.
       3. `instructionFor` is the only producer of instruction text, and
          the concatenation below is the only line that assembles any --
          one line, no template literal, greppable.
       4. Every `copyText` call site is handed either a local assigned from
          `instructionFor`, the queue's join of those, or `JSON.stringify`
          of a payload object. */

  var TEMPLATES = Object.freeze(Object.assign(Object.create(null), {
    implement: "Implement proposal",
    rollback: "Roll back run",
    revisit: "Revisit backlog entry",
    audit: "Re-audit material"
  }));

  /* ledger.schema.json's own record-id pattern, anchored at both ends. */
  var ID_RE = /^(MAT|PROP|RUN|ADR|BASE)-\d{4}-\d{3}(-P)?$/;

  /* The safe order for a batch: undo before redo. A rollback pasted after
     an implementation would be applied to a setup that implementation had
     already changed, which is the one ordering mistake a queue can make
     that is worse than having no queue. */
  var QUEUE_ORDER = ["rollback", "revisit", "audit", "implement"];

  /* In memory, in this tab, and nowhere else. The queue is scratch state,
     not ledger content: persisting it would put a half-finished list of
     instructions in localStorage for the next reader to find. */
  var QUEUE = [];

  /* The only producer of instruction text in this file. Both halves are
     checked before they meet, and either failure returns null rather than
     a partial string: a caller that gets null renders no control at all,
     because a button that produced nothing would be worse than a button
     that is not there. */
  function instructionFor(action, id) {
    if (typeof own(TEMPLATES, action) !== "string") { return null; }
    if (typeof id !== "string" || !ID_RE.test(id)) { return null; }
    return TEMPLATES[action] + " " + id;
  }

  /* A payload object as JSON, which is the one export that cannot invent
     anything: it is the document's own object, stringified. It does carry
     the record's own words -- that is what an export is -- and it is
     therefore never routed anywhere an instruction is expected. */
  function exportText(value) {
    return JSON.stringify(value, null, 2);
  }

  /* Build spec section 1.4's tiers, in order, and the third is not a
     fallback but a constant: the read-only box is filled and revealed on
     every copy, whether or not either programmatic tier worked. A file:
     origin is not a secure context, so `navigator.clipboard` is usually
     absent there; a browser that has also retired the selection path
     leaves the box as the whole mechanism, and it is still enough. */
  function copyText(text) {
    var value = typeof text === "string" ? text : "";
    var box = revealCopy(value);
    if (writeViaClipboard(value)) { announce(t("action.copied")); return; }
    if (writeViaSelection(box)) { announce(t("action.copied")); return; }
    announce(t("action.copy_manual"));
  }

  /* Tier one. The promise is not awaited -- there is nothing to do with
     the result but say so -- but a rejection is caught, because an
     uncaught one would leave the reader with "Copied" on screen and an
     empty clipboard. */
  function writeViaClipboard(value) {
    var nav = window.navigator;
    var api = nav && typeof nav === "object" ? nav.clipboard : null;
    if (!api || typeof api.writeText !== "function") { return false; }
    try {
      var pending = api.writeText(value);
      if (pending && typeof pending.catch === "function") {
        pending.catch(function () { announce(t("action.copy_manual")); });
      }
      return true;
    } catch (err) {
      return false;
    }
  }

  /* Tier two: select the box's own contents and ask the document to copy
     the selection. The box is both the selection source and the manual
     tier, so there is one element holding the text rather than two that
     could disagree about what was copied. */
  function writeViaSelection(node) {
    if (!node || typeof node.select !== "function") { return false; }
    if (typeof document.execCommand !== "function") { return false; }
    /* Copying is not the reader's cue to lose their place: this tier
       moves focus onto the read-only box to select it, so whatever had
       focus before this call is put back afterwards. Guarded on both
       sides -- there may be nothing to restore, and the thing there may
       not be a real, focusable element -- so a page with nothing focused
       yet fails closed into doing nothing rather than throwing. */
    var previous = document.activeElement;
    try {
      node.focus();
      node.select();
      return document.execCommand("copy") === true;
    } catch (err) {
      return false;
    } finally {
      if (previous && previous !== node && typeof previous.focus === "function") {
        previous.focus();
      }
    }
  }

  function revealCopy(value) {
    var label = document.getElementById("aio-copylabel");
    if (label) { label.textContent = t("action.copy_manual_label"); }
    var area = document.getElementById("aio-copytext");
    if (!area) { return null; }
    area.value = value;
    var box = document.getElementById("aio-copybox");
    if (box) { box.hidden = false; }
    return area;
  }

  /* One live region for every action's result. Visible as well as
     announced: a reader watching the button they just pressed should not
     have to take a screen reader's word for what happened. */
  function announce(message) {
    var live = document.getElementById("aio-live");
    if (live) { live.textContent = message; }
  }

  function actionButton(labelKey, onActivate) {
    var node = h("button", { type: "button", class: "action" }, t(labelKey));
    node.addEventListener("click", onActivate);
    return node;
  }

  /* The copy/queue pair for one instruction, or nothing at all when the
     pair `instructionFor` was given is not one it will answer for. */
  function instructionActions(kind, id) {
    var instruction = instructionFor(kind, id);
    if (instruction === null) { return null; }
    /* No role/aria-label on this span: `recordActions` below wraps it in
       its own role="group" carrying the same label, and a group nested
       inside an identically-labelled group is a duplicate a screen
       reader would announce twice for nothing. The one caller that uses
       this span by itself -- `chainList`'s provenance line -- puts it in
       a plain list item, not a group, and its two buttons still carry
       their own labels either way. */
    return h(
      "span",
      { class: "actions-row" },
      actionButton("action.copy_instruction", function () {
        copyText(instruction);
      }),
      actionButton("action.queue_add", function () {
        enqueue(kind, instruction);
      })
    );
  }

  function exportButton(record) {
    return actionButton("action.export", function () {
      copyText(exportText(record));
    });
  }

  /* The row of controls a record gets: its instruction, if this page has
     one for that kind of record, and its export, which every record has.
     A `kind` of null is how a panel says "export only" -- `own` answers
     undefined for it, so the pair above is simply absent. */
  function recordActions(kind, record) {
    return h(
      "div",
      { class: "actions-row", role: "group", "aria-label": t("table.actions") },
      instructionActions(kind, record.id),
      exportButton(record)
    );
  }

  function enqueue(kind, instruction) {
    var i;
    for (i = 0; i !== QUEUE.length; i += 1) {
      if (QUEUE[i].text === instruction) { announce(t("action.queued")); return; }
    }
    QUEUE.push({ kind: kind, text: instruction });
    announce(t("action.queued"));
    renderQueue();
  }

  /* Sorts a copy, and the sort is stable, so two instructions of the same
     kind keep the order they were added in. */
  function queueOrdered() {
    return QUEUE.slice().sort(function (left, right) {
      return QUEUE_ORDER.indexOf(left.kind) - QUEUE_ORDER.indexOf(right.kind);
    });
  }

  function queueText() {
    return queueOrdered().map(function (entry) {
      return entry.text;
    }).join("\n");
  }

  /* Rebuilt in place rather than through `render()`: a full render would
     also rebuild the Rollback panel, and rebuilding that panel resets the
     confirmation a reader had just given. Adding something to a queue
     should not silently disarm a control on another tab. */
  function renderQueue() {
    var host = document.getElementById("aio-queue");
    if (!host) { return; }
    /* `open` is a DOM property a reader toggles by hand, never an
       attribute this file writes -- it is deliberately absent from
       ALLOWED_ATTRS, so it cannot be set through h()'s attrs object (the
       same reason `step.hidden` above is set as a property rather than
       routed through h()). Read the outgoing drawer's state before it is
       discarded and rebuilt, so adding one more item to an open drawer
       does not close it on the reader. */
    var previousDrawer = host.firstChild;
    var wasOpen = previousDrawer ? previousDrawer.open === true : false;
    clear(host);
    var body = h("div", { class: "queue-body" });
    if (QUEUE.length === 0) {
      body.appendChild(h("p", { class: "note" }, t("queue.empty")));
    } else {
      body.appendChild(h("p", { class: "note" }, t("queue.order")));
      body.appendChild(h("ol", { class: "queue-list" }, queueOrdered().map(
        function (entry) {
          return h("li", { lang: "en" }, entry.text);
        }
      )));
      body.appendChild(h(
        "div",
        { class: "actions-row", role: "group", "aria-label": t("queue.title") },
        actionButton("queue.copy_all", function () { copyText(queueText()); }),
        actionButton("queue.clear", function () {
          QUEUE.length = 0;
          announce(t("queue.cleared"));
          renderQueue();
        })
      ));
    }
    var drawer = h(
      "details",
      { class: "queue-drawer" },
      h("summary", null, t("queue.title") + " " + String(QUEUE.length)),
      body
    );
    drawer.open = wasOpen;
    host.appendChild(drawer);
  }

  /* A file: URL for a path the ledger recorded *as a path*, and never for
     an anchor.

     This is the one place Task 6 had to narrow design spec section 12.2.
     The section offers to open "the record, the backup, or the changed
     file", and none of the three is reachable from this payload: an anchor
     is stored as "$NAME/..." by construction -- `resolve_anchored` refuses
     an absolute one -- and neither the drift report nor the rollback
     preview carries the path it actually opened, only the anchor it
     classified. A record's `file` is relative to the ledger, which this
     page cannot resolve without knowing where the ledger is. So the honest
     set of linkable paths is the one the ledger stores as real paths:
     `known_projects[].project_root` and `.ledger_path`, which `build`
     itself stats directly. Everything else gets no link rather than a
     guess.

     Returns null for anything that is not an absolute local path, which is
     what makes "no path, no Open button" a property of this function
     rather than of each caller. The encoding, pinned by test: backslashes
     become forward slashes, every segment is percent-encoded, and the
     drive letter's colon is left alone -- "file:///C:/Users/a%20b". A UNC
     path is refused outright: it names a host, and following it would be a
     request over the network wearing a local scheme, which is exactly what
     `safeHref` refuses on the other side. */
  function fileUrl(path) {
    if (typeof path !== "string" || path === "") { return null; }
    if (path.indexOf(SEPARATOR) !== -1) { return null; }
    var slashed = path.replace(/\\/g, "/");
    var drive = /^([A-Za-z]):\//.exec(slashed);
    var head = "";
    var rest = "";
    if (drive !== null) {
      head = drive[1] + ":/";
      rest = slashed.slice(drive[0].length);
    } else if (slashed.charAt(0) === "/" && slashed.charAt(1) !== "/") {
      rest = slashed.slice(1);
    } else {
      return null;
    }
    return "file:///" + head + rest.split("/").map(encodeURIComponent).join("/");
  }

  function openLink(labelKey, path) {
    var url = fileUrl(path);
    if (url === null) { return null; }
    return h("a", { class: "action", href: url, title: path }, t(labelKey));
  }

  /* Language ---------------------------------------------------------- */

  function t(key) {
    var dict = DICTS ? DICTS[LANG] : null;
    if (dict && typeof dict[key] === "string") { return dict[key]; }
    var fallback = DICTS ? DICTS[FALLBACK_LANG] : null;
    if (fallback && typeof fallback[key] === "string") { return fallback[key]; }
    /* A key with no string anywhere renders as itself: visibly wrong, which
       is the point -- the parity test exists so this never ships. */
    return key;
  }

  function matchLang(code) {
    if (typeof code !== "string" || code === "") { return null; }
    var keys = DICTS ? Object.keys(DICTS) : [];
    var wanted = code.toLowerCase();
    var i;
    for (i = 0; i !== keys.length; i += 1) {
      if (keys[i].toLowerCase() === wanted) { return keys[i]; }
    }
    var prefix = wanted.split("-")[0];
    for (i = 0; i !== keys.length; i += 1) {
      if (keys[i].toLowerCase().split("-")[0] === prefix) { return keys[i]; }
    }
    return null;
  }

  /* Design spec section 5's order: the fragment wins, then what the build
     recorded, then what this reader chose last time on this machine, then
     the browser's own preference, then English. The stored preference sits
     below the payload deliberately: a page built --lang pt-BR states a
     choice someone made about this ledger, and a leftover preference should
     not overrule it. */
  function resolveLang(fragmentLang, payloadLang) {
    var candidates = [fragmentLang, payloadLang, stored(STORE_LANG), navigatorLang()];
    for (var i = 0; i !== candidates.length; i += 1) {
      var matched = matchLang(candidates[i]);
      if (matched) { return matched; }
    }
    return FALLBACK_LANG;
  }

  function navigatorLang() {
    try {
      return window.navigator.language || null;
    } catch (err) {
      return null;
    }
  }

  /* Preferences ------------------------------------------------------- */

  /* file: pages have an opaque origin in some browsers, so storage throws
     rather than returning null. Design spec section 4 accepts that: the
     preference simply resets per session. */
  function stored(key) {
    try {
      return window.localStorage.getItem(key);
    } catch (err) {
      return null;
    }
  }

  function store(key, value) {
    try {
      window.localStorage.setItem(key, value);
    } catch (err) {
      return;
    }
  }

  function currentDensity() {
    var saved = stored(STORE_DENSITY);
    return DENSITIES.indexOf(saved) === -1 ? DENSITIES[0] : saved;
  }

  function applyDensity(value) {
    document.body.setAttribute("data-density", value);
  }

  /* Routing ----------------------------------------------------------- */

  function decode(value) {
    try {
      return decodeURIComponent(value);
    } catch (err) {
      return value;
    }
  }

  function parseHash() {
    var raw = String(window.location.hash || "");
    if (raw.charAt(0) === "#") { raw = raw.slice(1); }
    var state = { panel: DEFAULT_PANEL, lang: null, f: "" };
    raw.split("&").forEach(function (part) {
      if (part === "") { return; }
      var split = part.indexOf("=");
      var key = decode(split === -1 ? part : part.slice(0, split));
      var value = split === -1 ? "" : decode(part.slice(split + 1));
      if (key === "panel" && PANELS.indexOf(value) !== -1) {
        state.panel = value;
      } else if (key === "lang") {
        state.lang = value;
      } else if (key === "f") {
        state.f = value;
      }
    });
    return state;
  }

  function buildHash(state) {
    var parts = ["panel=" + encodeURIComponent(state.panel)];
    if (state.lang) { parts.push("lang=" + encodeURIComponent(state.lang)); }
    if (state.f) { parts.push("f=" + encodeURIComponent(state.f)); }
    return "#" + parts.join("&");
  }

  /* A panel switch is navigation and earns a history entry; a language or
     filter change is a view preference and replaces instead, so the back
     button still leaves the page rather than unwinding a dozen keystrokes
     (design spec section 4). */
  function goTo(state, replaceOnly) {
    var next = buildHash(state);
    if (window.location.hash === next) { render(); return; }
    if (replaceOnly) { window.location.replace(next); return; }
    window.location.hash = next;
  }

  /* Command palette ------------------------------------------------------
     Design spec section 4: Ctrl/Cmd+K over records, files, and keys.

     The index is built once, from the payload, and never from anything the
     reader types. Each entry is three strings -- the label the reader sees,
     the panel that shows it, and the filter text that finds it there -- and
     choosing one is nothing but `goTo({panel, f})`. The palette therefore
     adds no way to reach a view the fragment could not already address,
     which is what keeps it a search box rather than a second router.

     Every label reaches the document through `h()`, whose only path for a
     string is `document.createTextNode` (see `appendAll`). A record titled
     like markup is a record titled like markup here exactly as it is in the
     panels -- there is no second escaping story to get wrong. */

  function buildPaletteIndex() {
    var entries = [];
    /* Null-prototype: every key below is ledger content joined together,
       and "constructor" is a legal record title. */
    var seen = Object.create(null);

    function add(text, panel) {
      if (typeof text !== "string" || text === "") { return; }
      if (PANELS.indexOf(panel) === -1) { return; }
      var id = [panel, text].join(SEPARATOR);
      if (own(seen, id) !== undefined) { return; }
      seen[id] = true;
      entries.push({ label: text, panel: panel, f: text });
    }

    ledgerList("records").forEach(function (record) {
      if (!record || typeof record !== "object") { return; }
      var panel = own(PALETTE_PANELS, record.type);
      if (typeof panel !== "string") { return; }
      add(record.id, panel);
      add(record.title, panel);
      var targets = Array.isArray(record.targets) ? record.targets : [];
      targets.forEach(function (target) {
        if (!target || typeof target !== "object") { return; }
        /* An anchor and a key are what the Provenance panel indexes on, so
           that is where a search for either has to land -- not on Changes,
           which lists them per run and would answer "which run touched
           this file?" with one of the runs rather than with all of them. */
        add(target.anchor, "provenance");
        add(target.key, "provenance");
      });
    });

    ledgerList("baselines").forEach(function (entry) {
      if (!entry || typeof entry !== "object") { return; }
      /* Not `add(entry.id, "inventory")`: a baseline's own id (`BASE-...`)
         renders on no panel at all -- Inventory lists items, not baselines
         -- so indexing it could only ever dead-end a search. */
      var items = Array.isArray(entry.items) ? entry.items : [];
      items.forEach(function (item) {
        if (!item || typeof item !== "object") { return; }
        add(item.name, "inventory");
        add(item.anchor, "inventory");
      });
    });

    ledgerList("backlog").forEach(function (entry) {
      if (!entry || typeof entry !== "object") { return; }
      add(entry.id, "backlog");
    });

    return entries;
  }

  function paletteNode() {
    return document.getElementById("aio-palette");
  }

  function paletteIsOpen() {
    return paletteNode().hidden === false;
  }

  /* The dialog's own words, re-set on every render so a language switch
     while it is open does not leave half of it in the old language. */
  function renderPaletteChrome() {
    document.getElementById("aio-palette-title").textContent = t("palette.title");
    document.getElementById("aio-palette-label").textContent = t("palette.label");
    document.getElementById("aio-palette-close").textContent = t("palette.close");
    if (paletteIsOpen()) {
      renderPaletteResults(document.getElementById("aio-palette-input").value);
    }
  }

  function paletteMatches(query) {
    var wanted = String(query === null || query === undefined ? "" : query);
    if (wanted === "") { return PALETTE_INDEX.slice(0); }
    return PALETTE_INDEX.filter(function (entry) {
      return matchesFilter(entry.label, wanted);
    });
  }

  function renderPaletteResults(query) {
    var list = document.getElementById("aio-palette-results");
    var count = document.getElementById("aio-palette-count");
    clear(list);
    PALETTE_MATCHES = paletteMatches(query);
    var stops = [document.getElementById("aio-palette-input")];
    PALETTE_MATCHES.slice(0, PALETTE_RESULTS).forEach(function (entry) {
      var button = paletteResult(entry);
      stops.push(button);
      list.appendChild(h("li", null, button));
    });
    stops.push(document.getElementById("aio-palette-close"));
    PALETTE_STOPS = stops;
    /* M3: a rebuild replaces every result button with a new one, so a focus
       that was on one of the old buttons is now on a node this render just
       discarded -- a detached focus the Tab trap cannot recover, because it
       only ever looks at the *current* stops. The input and the close
       button are never rebuilt, so this only fires exactly when it needs
       to: never while the reader is typing (focus stays on the input,
       which is always in `stops`), and always when the render that just
       ran pulled the rug out from under a result button. */
    if (paletteIsOpen() && stops.indexOf(document.activeElement) === -1) {
      document.getElementById("aio-palette-input").focus();
    }
    var total = String(PALETTE_MATCHES.length);
    count.textContent = t("palette.results") + " " + total;
    clear(document.getElementById("aio-palette-note"));
    if (PALETTE_MATCHES.length === 0) {
      document.getElementById("aio-palette-note")
        .appendChild(h("p", { class: "palette-empty" }, t("palette.empty")));
    } else if (PALETTE_MATCHES.length > PALETTE_RESULTS) {
      document.getElementById("aio-palette-note")
        .appendChild(h("p", { class: "palette-empty" }, t("palette.truncated")));
    }
    /* The visible count is inside the dialog; the announcement goes through
       the page's one live region, so a screen reader hears the tally change
       as it is typed without a second polite region competing with it. M5:
       only when that count actually changed, so retyping the same total
       (a backspace and its undo, two keystrokes either side of a debounce
       window) does not repeat an announcement already heard. */
    if (PALETTE_MATCHES.length !== PALETTE_LAST_ANNOUNCED) {
      PALETTE_LAST_ANNOUNCED = PALETTE_MATCHES.length;
      announce(t("palette.results") + " " + total);
    }
  }

  function paletteResult(entry) {
    var node = h(
      "button",
      { type: "button", class: "palette-result" },
      entry.label,
      " ",
      h("span", { class: "palette-panel" }, t("panel." + entry.panel + ".title"))
    );
    node.addEventListener("click", function () { paletteGo(entry); });
    return node;
  }

  /* Choosing a match is a panel switch, so it pushes a history entry the
     way every other panel switch does -- the reader who searched their way
     into a panel can press Back out of it. */
  function paletteGo(entry) {
    closePalette();
    goTo({ panel: entry.panel, lang: parseHash().lang, f: entry.f }, false);
  }

  function openPalette(invoker) {
    if (paletteIsOpen()) { return; }
    PALETTE_INVOKER = invoker && typeof invoker.focus === "function" ? invoker : null;
    var input = document.getElementById("aio-palette-input");
    input.value = "";
    /* M5: a fresh session announces its first count regardless of what the
       last session last said, so this cannot read as silence. */
    PALETTE_LAST_ANNOUNCED = null;
    paletteNode().hidden = false;
    renderPaletteResults("");
    input.focus();
  }

  /* Focus goes back where it came from. A dialog that drops the focus on
     `body` costs a keyboard reader their whole place in the document, and
     the reader who pressed Ctrl+K to look something up is exactly the
     reader who wants to carry on where they were. */
  function closePalette() {
    if (!paletteIsOpen()) { return; }
    paletteNode().hidden = true;
    PALETTE_STOPS = [];
    PALETTE_MATCHES = [];
    var invoker = PALETTE_INVOKER;
    PALETTE_INVOKER = null;
    if (invoker) { invoker.focus(); }
  }

  /* The trap. `aria-modal` tells assistive technology the rest of the page
     is out of play; nothing tells the Tab key that, so this does. */
  function trapTab(event) {
    if (PALETTE_STOPS.length === 0) { return; }
    event.preventDefault();
    var at = PALETTE_STOPS.indexOf(document.activeElement);
    var step = event.shiftKey ? -1 : 1;
    var next = step === 1 ? 0 : PALETTE_STOPS.length - 1;
    if (at !== -1) {
      next = (at + step + PALETTE_STOPS.length) % PALETTE_STOPS.length;
    }
    PALETTE_STOPS[next].focus();
  }

  /* M4: an exact, case-insensitive label match wins over an earlier
     substring one. `PALETTE_MATCHES` is in payload order, which is a
     reasonable default when nothing matches exactly -- but a reader who
     typed a whole record title, expecting the record that title names,
     should not land on an unrelated record whose label merely contains it
     and happens to sort first. Falls back to the first match, exactly the
     prior behaviour, when nothing is exact. */
  function paletteChoice(query) {
    var wanted = String(query === null || query === undefined ? "" : query).toLowerCase();
    for (var i = 0; i < PALETTE_MATCHES.length; i += 1) {
      if (PALETTE_MATCHES[i].label.toLowerCase() === wanted) { return PALETTE_MATCHES[i]; }
    }
    return PALETTE_MATCHES[0];
  }

  /* One handler on the dialog, reached by bubbling from whichever of its
     controls has the focus. */
  function onPaletteKey(event) {
    var key = typeof event.key === "string" ? event.key : "";
    if (key === "Escape") {
      event.preventDefault();
      closePalette();
      return;
    }
    if (key === "Tab") {
      trapTab(event);
      return;
    }
    if (key === "Enter") {
      event.preventDefault();
      if (PALETTE_MATCHES.length !== 0) {
        paletteGo(paletteChoice(document.getElementById("aio-palette-input").value));
      }
    }
  }

  /* Both spellings of the shortcut, because both are what the header
     promises: Ctrl+K is the shortcut everywhere but macOS and Cmd+K is the
     shortcut there, and a page that honoured only one would be advertising
     a key that does nothing on half the machines that open it. Escape is
     handled here as well as on the dialog, so a stray focus outside the
     dialog still leaves the reader a way out.

     M3: so is Tab. `trapTab` is reached from the dialog's own `keydown`
     listener, which only ever fires when the focus is somewhere inside the
     dialog for a browser's bubbling to find it. A focus that has gone
     detached -- outside the dialog entirely, whether from a rebuild this
     render missed or from anything else -- produces a Tab keydown no
     element inside the dialog ever sees, and the browser is then free to
     move real focus behind the backdrop. `document` sees every keydown
     regardless of where focus is, so the trap is repeated here as a
     backstop: while the palette is open, Tab is never allowed to leave it,
     even from a focus this page can no longer account for. */
  function onGlobalKey(event) {
    var key = typeof event.key === "string" ? event.key : "";
    if ((event.ctrlKey === true || event.metaKey === true) && key.toLowerCase() === "k") {
      if (typeof event.preventDefault === "function") { event.preventDefault(); }
      if (paletteIsOpen()) { closePalette(); return; }
      openPalette(document.activeElement);
      return;
    }
    if (key === "Escape" && paletteIsOpen()) { closePalette(); return; }
    if (key === "Tab" && paletteIsOpen()) { trapTab(event); }
  }

  /* Wired once, at boot. Wiring it from `render` would add one listener per
     render and a palette that opened, closed, and reopened itself on a
     single keystroke by the tenth one. */
  function wirePalette() {
    PALETTE_INDEX = buildPaletteIndex();
    /* Closed, stated rather than assumed. The markup ships the `hidden`
       attribute, but "is the palette open?" is answered everywhere else by
       the property, and a dialog whose closed state depends on a reader of
       the markup agreeing with a reader of the DOM is a dialog that opens
       on some engine nobody tested. */
    paletteNode().hidden = true;
    paletteNode().addEventListener("keydown", onPaletteKey);
    var input = document.getElementById("aio-palette-input");
    input.addEventListener("input", function () {
      renderPaletteResults(input.value);
    });
    document.getElementById("aio-palette-close").addEventListener(
      "click",
      function () { closePalette(); }
    );
    document.addEventListener("keydown", onGlobalKey);
  }

  function paletteButton() {
    var node = h(
      "button",
      {
        type: "button",
        class: "hint",
        title: t("action.palette_hint"),
        "aria-keyshortcuts": "Control+K Meta+K"
      },
      t("action.palette")
    );
    node.addEventListener("click", function () { openPalette(node); });
    return node;
  }

  /* Rendering --------------------------------------------------------- */

  function render() {
    var state = parseHash();
    LANG = resolveLang(state.lang, PAYLOAD ? PAYLOAD.lang : null);
    document.documentElement.lang = LANG;
    document.title = t("app.title");
    renderCopyChrome();
    renderChrome(state);
    renderPaletteChrome();
    renderNav(state);
    renderQueue();
    renderPanels(state);
    renderFooter();
    announceFilter(state);
  }

  /* One announcement per render, after every panel has counted its rows:
     the tally the reader wants is the one for the panel they are looking
     at, and it is only interesting while a filter is on. Announced last so
     it survives `renderCopyChrome`, which clears the region at the top of
     the same render. */
  function announceFilter(state) {
    if (state.f === "") { return; }
    var shown = own(FILTER_COUNTS, state.panel);
    if (shown === undefined) { return; }
    announce(t("filter.matches") + " " + String(shown));
  }

  /* The two pieces of chrome that live outside any panel and outside
     `renderQueue`, and that a language switch would otherwise leave
     stale: the manual-copy box's label, which `revealCopy` only ever
     sets in the language of whichever copy last ran, and the live
     region, whose last announcement is a message from before the switch
     and would otherwise sit there in the old language until the next
     action. The label is re-set even while the box is hidden -- it
     costs nothing and it means the box is never one render behind by
     the time it is revealed. The live region is cleared rather than
     re-translated: there is no message to translate, only a stale one
     to retire. */
  function renderCopyChrome() {
    var label = document.getElementById("aio-copylabel");
    if (label) { label.textContent = t("action.copy_manual_label"); }
    var live = document.getElementById("aio-live");
    if (live) { live.textContent = ""; }
  }

  function renderChrome(state) {
    document.getElementById("aio-skip").textContent = t("action.skip_to_main");
    document.getElementById("aio-title").textContent = t("app.title");
    document.getElementById("aio-tagline").textContent = t("app.tagline");

    var actions = document.getElementById("aio-actions");
    clear(actions);

    actions.appendChild(h(
      "div",
      { class: "group", role: "group", "aria-label": t("action.language") },
      h("span", { class: "label" }, t("action.language")),
      langButton("en", "action.lang_en", state),
      langButton("pt-BR", "action.lang_pt_br", state)
    ));

    actions.appendChild(h(
      "div",
      { class: "group", role: "group", "aria-label": t("action.density") },
      h("span", { class: "label" }, t("action.density")),
      densityButton("comfortable", "action.density_comfortable"),
      densityButton("compact", "action.density_compact")
    ));

    /* The shortcut hint was a paragraph until Task 7 gave it something to
       do. A page that advertises Ctrl+K and offers no other way in is a
       page a mouse cannot search, so the hint is now the button and the
       sentence it used to be is its tooltip. */
    actions.appendChild(paletteButton());

    document.getElementById("aio-mode").textContent = modeChipText();
  }

  /* Design spec section 4 wants the mode legible in the header, not only in
     the footer: a reader who never scrolls down should still know whether
     what they are looking at was computed or merely injected. Built pages
     show when they were generated; static pages say so in words. */
  function modeChipText() {
    if (PAYLOAD && PAYLOAD.mode === "built") {
      return t("chip.generated") + " " + textOr(PAYLOAD.generated_at);
    }
    if (PAYLOAD && PAYLOAD.mode === "static") { return t("chip.static"); }
    return t("chip.mode_unknown");
  }

  function langButton(code, key, state) {
    var node = h(
      "button",
      { type: "button", lang: code, "aria-pressed": String(code === LANG) },
      t(key)
    );
    node.addEventListener("click", function () {
      store(STORE_LANG, code);
      goTo({ panel: state.panel, lang: code, f: state.f }, true);
    });
    return node;
  }

  function densityButton(value, key) {
    var node = h(
      "button",
      { type: "button", "aria-pressed": String(value === currentDensity()) },
      t(key)
    );
    node.addEventListener("click", function () {
      store(STORE_DENSITY, value);
      applyDensity(value);
      render();
    });
    return node;
  }

  function buildNav() {
    var nav = document.getElementById("aio-nav");
    clear(nav);
    NAV_BUTTONS = PANELS.map(function (panel) {
      var node = h("button", {
        type: "button",
        role: "tab",
        "data-panel": panel,
        "aria-controls": "aio-panel-" + panel,
        "aria-selected": "false",
        tabindex: "-1"
      });
      /* Assigned here rather than through h(): `id` is off the attribute
         allow-list so no ledger string can ever mint one, and the panel
         sections above name these ids in aria-labelledby, so the tab strip
         still owes them. The value is a constant from PANELS -- it is the
         tool naming its own chrome, not content naming anything. */
      node.id = "aio-tab-" + panel;
      node.addEventListener("click", function () {
        goTo({ panel: panel, lang: parseHash().lang, f: parseHash().f }, false);
        node.focus();
      });
      node.addEventListener("keydown", onNavKey);
      nav.appendChild(node);
      return node;
    });
  }

  /* Roving tabindex: the tab strip is one stop in the tab order and the
     arrow keys move within it, which is what a tablist owes a keyboard. */
  function onNavKey(event) {
    var active = parseHash().panel;
    var index = PANELS.indexOf(active);
    var next = null;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (index + 1) % PANELS.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (index + PANELS.length - 1) % PANELS.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = PANELS.length - 1;
    }
    if (next === null) { return; }
    event.preventDefault();
    goTo({ panel: PANELS[next], lang: parseHash().lang, f: parseHash().f }, false);
    NAV_BUTTONS[next].focus();
  }

  function renderNav(state) {
    var nav = document.getElementById("aio-nav");
    nav.hidden = false;
    nav.setAttribute("aria-label", t("action.panels"));
    PANELS.forEach(function (panel, index) {
      var node = NAV_BUTTONS[index];
      if (!node) { return; }
      node.textContent = t("panel." + panel + ".title");
      var selected = panel === state.panel;
      node.setAttribute("aria-selected", String(selected));
      node.setAttribute("tabindex", selected ? "0" : "-1");
    });
  }

  function panelSection(panel) {
    return document.getElementById("aio-panel-" + panel);
  }

  /* Every panel is populated on every render, and only then hidden. That is
     not waste: print correctness depends on it. The print stylesheet unhides
     all nine sections so a printed page is the whole ledger rather than
     whichever tab happened to be open, and it can only unhide sections that
     already have content in them. Do not optimize this loop to render the
     active panel only -- the screen would look identical and the printed
     ledger would quietly lose eight of its nine sections. */
  function renderPanels(state) {
    /* Rebuilt rather than cleared in place: a panel that took its empty
       branch this render records no count, and a leftover count from the
       last one would be announced as this one's. */
    FILTER_COUNTS = Object.create(null);
    PANELS.forEach(function (panel) {
      var section = panelSection(panel);
      if (!section) { return; }
      section.hidden = panel !== state.panel;
      section.setAttribute("data-wide", "false");
      clear(section);
      section.appendChild(h("h2", null, t("panel." + panel + ".title")));
      if (panel === "overview") {
        renderOverview(section);
      } else if (panel === "inventory") {
        renderInventory(section, state);
      } else if (panel === "changes") {
        renderChanges(section, state);
      } else if (panel === "provenance") {
        renderProvenance(section, state);
      } else if (panel === "rollback") {
        renderRollback(section, state);
      } else if (panel === "backlog") {
        renderBacklog(section, state);
      } else if (panel === "decisions") {
        renderDecisions(section, state);
      } else if (panel === "materials") {
        renderMaterials(section, state);
      } else if (panel === "help") {
        renderHelp(section);
      } else {
        /* Every panel in PANELS has a renderer above, so nothing reaches
           this branch today. It stays because the failure it catches is a
           panel added to PANELS without one: a section with a heading and
           nothing under it, which reads as "there is nothing here" rather
           than as an unfinished panel. The instructional empty state says
           what would fill it and the command that does the filling, which
           is what design spec section 4 asks of every empty state. */
        section.appendChild(h("p", { class: "empty" }, t("panel." + panel + ".empty")));
      }
    });
  }

  /* Three branches, not two. The assurance -- "built from a verified
     ledger" -- is the strongest claim this page makes, and it is made only
     when the payload says exactly "built". An `else` would have handed that
     claim to every value that is not "static": a typo, a mode from a newer
     tool, a hand-edited island. Anything unrecognised gets the unverified
     treatment instead, which is the safe direction to be wrong in. */
  function renderOverview(section) {
    if (PAYLOAD.mode === "static") {
      section.appendChild(statusBlock("warning", t("banner.static.title")));
      section.appendChild(h("p", { class: "empty" }, t("banner.static.detail")));
    } else if (PAYLOAD.mode === "built") {
      section.appendChild(statusBlock("info", t("banner.built.title")));
      section.appendChild(h("p", { class: "empty" }, t("banner.built.detail")));
      var age = ageInDays(PAYLOAD.generated_at);
      if (age !== null && age > STALE_AFTER_DAYS) {
        section.appendChild(statusBlock("warning", t("banner.stale")));
      }
    } else {
      section.appendChild(statusBlock("warning", t("banner.mode_unknown.title")));
      section.appendChild(h("p", { class: "empty" }, t("banner.mode_unknown.detail")));
    }

    var degraded = degradedKeys();
    if (degraded.length !== 0) {
      section.appendChild(statusBlock("warning", t("banner.degraded")));
      section.appendChild(h(
        "ul",
        { class: "keys" },
        degraded.map(function (key) { return h("li", null, h("code", null, key)); })
      ));
    }

    if (!PAYLOAD.ledger) {
      section.appendChild(h("p", { class: "empty" }, t("panel.overview.empty")));
      return;
    }

    renderIndicatorCards(section);
  }

  /* Design spec section 12.1's overview: one card per indicator, each with a
     glyph, a count, a label, and a link to the panel that details it.

     Two of the five are answerable from the ledger alone -- a RUN record
     says whether it was rolled back, and a known project records the status
     something last observed for it -- so those hold a number on a static
     page too. The other three are guarantees only dashboard.py can make:
     drift compares digests against disk, rollback-preview verifies a backup,
     and expiry is compared against the date the build ran. Those three say
     "unavailable" and name the command that would fill them, because a zero
     there reads as "nothing is wrong" and would be a lie. */
  function renderIndicatorCards(section) {
    var drift = computedFor("drift");
    var previews = computedFor("previews");
    var expired = computedFor("expired_evidence");
    var unreachable = unreachableProjects();
    var driftCount = drift === null ? null : driftIndicator(drift);
    var previewCount = previews === null ? null : previewIndicator(previews);

    var cards = h("ul", { class: "cards" });
    cards.appendChild(indicatorCard(
      "card.active_changes", "changes",
      { count: countActiveChanges(), severity: "info" }, null
    ));
    cards.appendChild(indicatorCard(
      "card.drift", "inventory", driftCount,
      unavailableNoteKey("drift", "card.unavailable.drift")
    ));
    cards.appendChild(indicatorCard(
      "card.rollbacks_at_risk", "rollback", previewCount,
      unavailableNoteKey("previews", "card.unavailable.previews")
    ));
    cards.appendChild(indicatorCard(
      "card.expired_evidence", "materials",
      expired === null ? null : listIndicator(expired),
      unavailableNoteKey("expired_evidence", "card.unavailable.expired_evidence")
    ));
    /* The one card whose detail is on this very panel: there is no Projects
       panel, and the roots are listed directly below the cards. The link
       still names a panel so every card behaves the same way. */
    cards.appendChild(indicatorCard(
      "card.unreachable_projects", "overview", listIndicator(unreachable), null
    ));
    section.appendChild(h("h3", null, t("overview.cards")));
    section.appendChild(cards);

    var projects = projectList(unreachable);
    if (projects !== null) {
      section.appendChild(h("h3", null, t("overview.projects")));
      section.appendChild(projects);
    }

    if (unreachable.length !== 0) {
      section.appendChild(h("h3", null, t("overview.unreachable")));
      section.appendChild(h("ul", { class: "keys" }, unreachable.map(function (root) {
        return h("li", null, h("code", { class: "path" }, root));
      })));
    }
  }

  /* The only Open links on this page (see `fileUrl` for why). A known
     project records two real paths, and they are the only two strings in
     the whole payload that are paths rather than anchors.

     A project whose root the build could not reach gets no link: an Open
     that leads nowhere is worse than no Open at all, because it reads as a
     promise the page can keep and cannot. A root that is not an absolute
     local path gets none either, and says so rather than going quiet --
     the reader should know the ledger recorded something this page cannot
     turn into a link, not be left wondering why one row has buttons and
     the next does not. */
  function projectList(unreachable) {
    var entries = ledgerList("known_projects").filter(function (entry) {
      return Boolean(entry) && typeof entry === "object";
    });
    if (entries.length === 0) { return null; }
    return h("ul", { class: "keys" }, entries.map(function (entry) {
      var gone = unreachable.indexOf(entry.project_root) !== -1;
      var root = gone ? null : openLink("projects.open_root", entry.project_root);
      var book = gone ? null : openLink("projects.open_ledger", entry.ledger_path);
      var note = null;
      if (gone) {
        note = h("span", { class: "note" }, t("projects.unreachable_note"));
      } else if (root === null && book === null) {
        note = h("span", { class: "note" }, t("projects.no_path"));
      }
      return h(
        "li",
        null,
        h("code", { class: "path" }, textOrDash(entry.project_root)),
        " ",
        h("code", { lang: "en" }, textOrDash(entry.status)),
        " ",
        note,
        h("span", { class: "actions-row" }, root, book)
      );
    }));
  }

  function indicatorCard(labelKey, panel, indicator, unavailableKey) {
    var missing = indicator === null;
    var severity = missing ? "info" : indicator.severity;
    return h(
      "li",
      { class: "card card-" + severity },
      h(
        "a",
        { class: "card-link", href: "#panel=" + panel },
        h("span", { class: "glyph", "aria-hidden": "true" }, GLYPHS[severity]),
        " ",
        missing
          ? h("span", { class: "unavailable" }, t("card.unavailable"))
          : h("span", { class: "card-count" }, String(indicator.count)),
        h("span", { class: "card-label" }, t(labelKey))
      ),
      h(
        "p",
        { class: "card-note" },
        missing ? t(unavailableKey) : t(labelKey + ".note")
      )
    );
  }

  /* The drift summary counts every state, IN_PLACE included. What belongs on
     an indicator card is what is not fine, so the quiet states are skipped
     rather than added and then subtracted, and the card's own severity is
     the worst state that actually has a count. */
  function driftIndicator(report) {
    var summary = report && typeof report === "object" ? report.summary : null;
    var total = 0;
    var worst = "info";
    if (summary && typeof summary === "object") {
      Object.keys(summary).forEach(function (state) {
        var count = summary[state];
        var severity = own(DRIFT_SEVERITY, state);
        if (typeof count !== "number" || count === 0) { return; }
        if (severity === undefined || severity === "info") { return; }
        total += count;
        if (severityRank(severity) < severityRank(worst)) { worst = severity; }
      });
    }
    return { count: total, severity: worst };
  }

  function previewIndicator(previews) {
    var total = 0;
    var worst = "info";
    Object.keys(previews).forEach(function (runId) {
      var preview = previews[runId];
      if (!preview || typeof preview !== "object") { return; }
      var severity = own(INDICATOR_SEVERITY, preview.indicator);
      if (severity === undefined || severity === "info") { return; }
      total += 1;
      if (severityRank(severity) < severityRank(worst)) { worst = severity; }
    });
    return { count: total, severity: worst };
  }

  /* Two different absences, and a reader should be able to tell them apart.
     "This page never computed it" is a static page and one command away;
     "this computation failed while the page was built" is a broken build,
     and rerunning the same command may not fix it. Both show no number --
     that part is not negotiable, since a zero would read as an all-clear.

     `degradedKey` defaults to `card.degraded`, which is written for an
