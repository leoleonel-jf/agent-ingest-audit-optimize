<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Governance ledger</title>
<style>
/* One stylesheet, no font file, no image, nothing to fetch. Every colour is
   a custom property so the dark palette is a swap rather than a second set
   of rules, and every box uses logical properties so a right-to-left
   dictionary would need no CSS at all. */

:root {
  color-scheme: light dark;

  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  --gap: 1.5rem;
  --step: 0.35rem;
  --measure: 68ch;

  /* Light palette. Every ink/background pair below clears WCAG 2.2 AA at
     body size; the muted ink clears it too, so secondary text is readable
     rather than decorative. */
  --bg: #fbfbfa;
  --surface: #ffffff;
  --ink: #1a1a1a;
  --ink-muted: #55524d;
  --rule: #d3d0ca;
  --accent: #1f4f8b;
  --error: #8c1d1d;
  --warning: #6f4a00;
  --info: #2a4b7c;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181a;
    --surface: #1e2124;
    --ink: #ececec;
    --ink-muted: #b3b6b8;
    --rule: #34383c;
    --accent: #8fb8ef;
    --error: #f19a9a;
    --warning: #e2b871;
    --info: #9dbbe8;
  }
}

body[data-density="compact"] {
  --gap: 0.9rem;
  --step: 0.2rem;
}

* { box-sizing: border-box; }

html { background: var(--bg); }

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.55;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

code { font-family: var(--font-mono); font-size: 0.9em; }

[hidden] { display: none !important; }

.skip-link {
  position: absolute;
  inset-block-start: -4rem;
  inset-inline-start: var(--gap);
  z-index: 3;
  padding: 0.4rem 0.7rem;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--accent);
  transition: inset-block-start 120ms ease;
}

.skip-link:focus { inset-block-start: 0.5rem; }

/* Header ------------------------------------------------------------- */

.chrome {
  display: flex;
  flex-wrap: wrap;
  gap: var(--gap);
  align-items: flex-end;
  justify-content: space-between;
  padding: calc(var(--gap) * 1.2) var(--gap) var(--gap);
  border-block-end: 1px solid var(--rule);
}

.chrome h1 {
  margin: 0;
  font-size: 1.2rem;
  font-weight: 600;
  letter-spacing: 0.005em;
}

.tagline {
  margin: var(--step) 0 0;
  max-inline-size: var(--measure);
  color: var(--ink-muted);
  font-size: 0.9rem;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.9rem;
  align-items: center;
}

.group {
  display: flex;
  align-items: center;
  gap: 0.3rem;
}

.group .label {
  color: var(--ink-muted);
  font-size: 0.8rem;
}

.hint {
  margin: 0;
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: 0.78rem;
}

/* The mode chip. Design spec section 4 asks the header to carry a
   generated-at line or a static-mode notice; this is it, kept to one short
   line so the header stays a header. The footer keeps the full detail. */
.chip {
  display: inline-block;
  margin: var(--step) 0 0;
  padding: 0.1rem 0.45rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 2px;
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: 0.75rem;
}

button {
  font: inherit;
  font-size: 0.85rem;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 2px;
  padding: 0.25rem 0.55rem;
  cursor: pointer;
}

button[aria-pressed="true"] {
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}

/* Panel navigation ---------------------------------------------------- */

.panels {
  position: sticky;
  inset-block-start: 0;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  gap: 0.2rem;
  padding: 0.45rem var(--gap);
  background: var(--bg);
  border-block-end: 1px solid var(--rule);
}

.panels button {
  background: transparent;
  border-color: transparent;
  padding: 0.3rem 0.65rem;
}

.panels button[aria-selected="true"] {
  background: var(--surface);
  border-color: var(--rule);
  color: var(--accent);
  font-weight: 600;
}

/* Panels -------------------------------------------------------------- */

main { padding: var(--gap); }
main:focus { outline: none; }

.panel { max-inline-size: var(--measure); }

.panel h2 {
  margin: 0 0 var(--step);
  font-size: 1.05rem;
  font-weight: 600;
}

.empty {
  margin: 0 0 var(--gap);
  color: var(--ink-muted);
}

.reference {
  margin: 0 0 var(--gap);
}

.reference dt {
  margin-block-start: var(--step);
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 600;
}

.reference dd {
  margin: 0 0 var(--step);
  margin-inline-start: 0;
  color: var(--ink-muted);
}

/* Status blocks. Severity is carried by a glyph and a word as well as by
   the rule colour, so nothing depends on seeing the hue. */

.status {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.5rem;
  margin: 0 0 var(--gap);
  padding: 0.55rem 0.75rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-inline-start: 3px solid var(--rule);
}

.status .status-label {
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  font-size: 0.78rem;
}

.status .status-text { flex: 1 1 20ch; }

.status-error { border-inline-start-color: var(--error); }
.status-error .glyph,
.status-error .status-label { color: var(--error); }

.status-warning { border-inline-start-color: var(--warning); }
.status-warning .glyph,
.status-warning .status-label { color: var(--warning); }

.status-info { border-inline-start-color: var(--info); }
.status-info .glyph,
.status-info .status-label { color: var(--info); }

.keys {
  margin: 0;
  padding-inline-start: 1.2rem;
  color: var(--ink-muted);
}

/* Footer -------------------------------------------------------------- */

footer {
  margin-block-start: calc(var(--gap) * 2);
  padding: var(--gap);
  border-block-start: 1px solid var(--rule);
  color: var(--ink-muted);
  font-size: 0.85rem;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.2rem 1.75rem;
  margin: 0;
}

.meta div { display: flex; gap: 0.4rem; }
.meta dt { font-weight: 600; }
.meta dd { margin: 0; margin-inline-start: 0; font-family: var(--font-mono); }

/* Narrow widths. The document is a single column already; below the
   breakpoint the tables Tasks 4-5 add fold into labelled cards, and the
   panel bar stops sticking so it never eats a short viewport. */

@media (max-width: 720px) {
  :root { --gap: 1rem; }

  .chrome { align-items: flex-start; }
  .panels { position: static; }

  .grid-table thead {
    position: absolute;
    inline-size: 1px;
    block-size: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }

  .grid-table tr {
    display: block;
    margin-block-end: var(--gap);
    padding: 0.5rem;
    border: 1px solid var(--rule);
  }

  .grid-table td {
    display: flex;
    gap: 0.75rem;
    justify-content: space-between;
    padding: 0.1rem 0;
    border: 0;
  }

  .grid-table td::before {
    content: attr(data-label);
    color: var(--ink-muted);
    font-weight: 600;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Print: black on white, no controls, every panel in document order so the
   PDF is the whole ledger rather than whichever tab was open.

   Print correctness requires every panel section to be populated on every
   render, not just the active one: this block unhides all nine, and it can
   only unhide what already has content in it. Do not optimize renderPanels
   to render the active panel only -- the printed ledger would silently lose
   eight of its nine sections, and no test that inspects the screen would
   notice. The same warning sits on renderPanels itself. */

@media print {
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --ink: #000000;
    --ink-muted: #2b2b2b;
    --rule: #8a8a8a;
    --accent: #000000;
    --error: #000000;
    --warning: #000000;
    --info: #000000;
  }

  .skip-link,
  .panels,
  .actions { display: none !important; }

  body { background: #ffffff; color: #000000; font-size: 11pt; }
  main { padding: 0; }

  .panel[hidden] { display: block !important; }

  .panel {
    max-inline-size: none;
    margin-block-end: 1.5rem;
    break-inside: avoid;
  }
}
</style>
</head>

<footer>

</footer>

    "help.canonical_labels": "Estados de operação, classificações, status e IDs de registro continuam em inglês em todas as telas. Eles são o vocabulário da ferramenta, e não texto corrido: traduzi-los quebraria a correspondência entre o que você lê aqui e o que os comandos imprimem.",
    "help.self_reported": "SELF-REPORTED marca tudo o que a ferramenta não conferiu. Um agente afirmou e nada verificou. Digests, estados de drift e prévias de rollback só contam como verificados em uma página produzida pelo dashboard.py build.",
    "help.modes": "Uma página built carrega um ledger que já passou pela verificação, porque o build recusa qualquer ledger que o verify rejeitaria. Uma página static carrega o que quer que tenha sido injetado à mão por último — e diz isso.",

    "footer.version": "Versão da ferramenta",
    "footer.mode": "Modo",
    "footer.generated": "Gerada em",
    "footer.age": "Idade em dias",
    "footer.unknown": "não disponível"
  }
}
</script>

<script>
/* The shell.

   Three rules hold this file together, and the static suite
   (dashboard/tests/test_shell.py) pins all three by reading this source
   rather than by rendering it:

   1. Ledger content enters through exactly one place, the JSON island above,
      and leaves through exactly one place, h() below. Text always lands as a
      text node or a textContent assignment. No markup is ever assembled from
      a string, which is why none of the DOM sinks the suite greps for
      appears anywhere in this file -- not in code, and not in these comments
      either, since that grep is deliberately unconditional.

   2. Every user-visible string comes from the dictionaries. The one
      exception is LAST_RESORT, which exists precisely for the case where the
      dictionaries cannot be read.

   3. The page asks for nothing. No fetch, no image, no font, no timer that
      takes a string. Opening this file offline and opening it online produce
      the same document. */

(function () {
  "use strict";

  var PAYLOAD_SCHEMA = 1;

  /* Panel order is the reading order of the whole tool: what happened, what
     exists, what changed, where it came from, how to undo it, what was
     deferred, what was decided, what it rests on, how to read any of it. */
  const PANELS = [
    "overview",
    "inventory",
    "changes",
    "provenance",
    "rollback",
    "backlog",
    "decisions",
    "materials",
    "help"
  ];

  var DEFAULT_PANEL = "overview";
  var FALLBACK_LANG = "en";
  var STALE_AFTER_DAYS = 7;
  var DAY_MS = 86400000;
  var DENSITIES = ["comfortable", "compact"];
  var STORE_LANG = "aio.lang";
  var STORE_DENSITY = "aio.density";

  /* The canonical vocabulary, English on screen in every language (design
     spec section 5). Held here as data so the Help panel and the Task 4-5
     renderers name the same eight states from one list. */
  var DRIFT_STATES = ["IN_PLACE", "DRIFTED", "REVERTED", "MISSING", "UNVERIFIABLE"];
  var ROLLBACK_INDICATORS = ["HEALTHY", "AT_RISK", "BROKEN"];

  /* Functional glyphs, not decoration: severity must be legible without
     colour (design spec section 7, acceptance item 3), so every status
     carries a shape and a word as well as a hue. */
  var GLYPHS = { error: "✕", warning: "▲", info: "●" };

  /* The only English sentence in this file. If the dictionary island itself
     cannot be read there is no key left to look a message up by, and saying
     nothing would leave a blank page that looks merely empty. */
  var LAST_RESORT = "This page is damaged: its embedded text could not be read.";

  /* The attribute allow-list. `id` is deliberately absent: an id chosen by
     ledger content would become a global name a later getElementById could
     pick up instead of the chrome's own element, so ids are set on the
     static markup above and, for the tab strip, assigned directly from the
     PANELS constant in buildNav -- never routed through h(). */
  var ALLOWED_ATTRS = [
    "class", "role", "title", "tabindex", "lang", "type", "for",
    "href", "hidden", "colspan", "scope"
  ];

  /* Tag names h() will build. A tag must look like a plain element name, and
     must not be one of the elements whose mere existence in the document is
     a capability: the ones that execute, embed, fetch, restyle, or submit.
     Anything else is coerced to a span, so a bad tag degrades to inert text
     rather than to a hole in the page's guarantees. `textarea` is absent
     from the refusal list on purpose -- Task 6's action model needs it. */
  var TAG_PATTERN = /^[a-z][a-z0-9]*$/;
  var FORBIDDEN_TAGS = [
    "script", "iframe", "object", "embed", "link", "meta", "base", "style",
    "form"
  ];

  var DICTS = null;
  var LANG = FALLBACK_LANG;
  var PAYLOAD = null;
  var NAV_BUTTONS = [];

  /* Building the DOM ------------------------------------------------- */

  function attrAllowed(name) {
    if (typeof name !== "string") { return false; }
    /* This prefix test is a fast refusal, not the guard. It is case
       sensitive, so "ONCLICK" walks straight past it -- what actually stops
       that name is the allow-list on the last line: an attribute reaches the
       DOM only by being listed there or by carrying an aria-/data- prefix,
       and no case of a handler name is in the list. Do not read this line as
       the sole defence and do not delete the allow-list beneath it. */
    if (name.slice(0, 2) === "on") { return false; }
    if (name.slice(0, 5) === "aria-") { return true; }
    if (name.slice(0, 5) === "data-") { return true; }
    return ALLOWED_ATTRS.indexOf(name) !== -1;
  }

  /* Coerces anything that is not a plain, permitted element name to "span".
     Silent for the same reason safeHref is silent: it is a rendering
     decision, and the caller is this file's own code. */
  function safeTag(tag) {
    if (typeof tag !== "string" || !TAG_PATTERN.test(tag)) { return "span"; }
    if (FORBIDDEN_TAGS.indexOf(tag) !== -1) { return "span"; }
    return tag;
  }

  /* The gate every generated link passes through. Two shapes are legal: an
     in-page fragment, and a file: link assembled from an anchor this tool
     resolved itself. Anything else becomes "#" -- refusal is silent because
     a rejected link is a rendering decision, not an event worth a message
     the reader cannot act on. */
  function safeHref(value) {
    if (typeof value !== "string") { return "#"; }
    if (value.charAt(0) === "#") { return value; }
    /* The file: form is accepted only with an empty authority -- the exact
       prefix "file:///" and no fourth slash after it. "file://host/share"
       names a host, and on Windows that is a UNC path: following it is a
       request over the network wearing a local scheme, which is precisely
       what this page promises never to issue. "file:////server/share" is the
       same thing spelled differently, so the fourth slash is refused too.
       Prefix matching is case sensitive on purpose: this tool writes these
       anchors itself and writes them lowercase, so any other spelling came
       from somewhere else and is not trusted. */
    if (value.lastIndexOf("file:///", 0) === 0 && value.charAt(8) !== "/") {
      return value;
    }
    return "#";
  }

  function h(tag, attrs, ...children) {
    var node = document.createElement(safeTag(tag));
    if (attrs) {
      Object.keys(attrs).forEach(function (name) {
        var value = attrs[name];
        if (value === null || value === undefined || value === false) { return; }
        if (!attrAllowed(name)) { return; }
        if (name === "href") {
          node.setAttribute(name, safeHref(String(value)));
          return;
        }
        node.setAttribute(name, String(value));
      });
    }
    appendAll(node, children);
    return node;
  }

  function appendAll(node, children) {
    children.forEach(function (child) {
      if (child === null || child === undefined || child === false) { return; }
      if (Array.isArray(child)) { appendAll(node, child); return; }
      if (typeof child === "string") {
        node.appendChild(document.createTextNode(child));
        return;
      }
      node.appendChild(child);
    });
  }

  function clear(node) {
    while (node.firstChild) { node.removeChild(node.firstChild); }
  }

  /* The severity word. Every caller but one reaches it through the
     dictionary; the exception is the last-resort path, which runs precisely
     because the dictionaries could not be read. There t() would hand back
     the literal key "status.error", and a page that is already telling the
     reader it is damaged should not also show them a lookup key. So the one
     English word is hard-coded here, beside the one English sentence. */
  function severityLabel(severity) {
    if (!DICTS) { return "Error"; }
    return t("status." + severity);
  }

  function statusBlock(severity, ...children) {
    return h(
      "p",
      { class: "status status-" + severity, role: severity === "error" ? "alert" : null },
      h("span", { class: "glyph", "aria-hidden": "true" }, GLYPHS[severity]),
      h("span", { class: "status-label" }, severityLabel(severity)),
      h("span", { class: "status-text" }, children)
    );
  }

  /* Language ---------------------------------------------------------- */

  function t(key) {
    var dict = DICTS ? DICTS[LANG] : null;
    if (dict && typeof dict[key] === "string") { return dict[key]; }
    var fallback = DICTS ? DICTS[FALLBACK_LANG] : null;
    if (fallback && typeof fallback[key] === "string") { return fallback[key]; }
    /* A key with no string anywhere renders as itself: visibly wrong, which
       is the point -- the parity test exists so this never ships. */
    return key;
  }

  function matchLang(code) {
    if (typeof code !== "string" || code === "") { return null; }
    var keys = DICTS ? Object.keys(DICTS) : [];
    var wanted = code.toLowerCase();
    var i;
    for (i = 0; i !== keys.length; i += 1) {
      if (keys[i].toLowerCase() === wanted) { return keys[i]; }
    }
    var prefix = wanted.split("-")[0];
    for (i = 0; i !== keys.length; i += 1) {
      if (keys[i].toLowerCase().split("-")[0] === prefix) { return keys[i]; }
    }
    return null;
  }

  /* Design spec section 5's order: the fragment wins, then what the build
     recorded, then what this reader chose last time on this machine, then
     the browser's own preference, then English. The stored preference sits
     below the payload deliberately: a page built --lang pt-BR states a
     choice someone made about this ledger, and a leftover preference should
     not overrule it. */
  function resolveLang(fragmentLang, payloadLang) {
    var candidates = [fragmentLang, payloadLang, stored(STORE_LANG), navigatorLang()];
    for (var i = 0; i !== candidates.length; i += 1) {
      var matched = matchLang(candidates[i]);
      if (matched) { return matched; }
    }
    return FALLBACK_LANG;
  }

  function navigatorLang() {
    try {
      return window.navigator.language || null;
    } catch (err) {
      return null;
    }
  }

  /* Preferences ------------------------------------------------------- */

  /* file: pages have an opaque origin in some browsers, so storage throws
     rather than returning null. Design spec section 4 accepts that: the
     preference simply resets per session. */
  function stored(key) {
    try {
      return window.localStorage.getItem(key);
    } catch (err) {
      return null;
    }
  }

  function store(key, value) {
    try {
      window.localStorage.setItem(key, value);
    } catch (err) {
      return;
    }
  }

  function currentDensity() {
    var saved = stored(STORE_DENSITY);
    return DENSITIES.indexOf(saved) === -1 ? DENSITIES[0] : saved;
  }

  function applyDensity(value) {
    document.body.setAttribute("data-density", value);
  }

  /* Routing ----------------------------------------------------------- */

  function decode(value) {
    try {
      return decodeURIComponent(value);
    } catch (err) {
      return value;
    }
  }

  function parseHash() {
    var raw = String(window.location.hash || "");
    if (raw.charAt(0) === "#") { raw = raw.slice(1); }
    var state = { panel: DEFAULT_PANEL, lang: null, f: "" };
    raw.split("&").forEach(function (part) {
      if (part === "") { return; }
      var split = part.indexOf("=");
      var key = decode(split === -1 ? part : part.slice(0, split));
      var value = split === -1 ? "" : decode(part.slice(split + 1));
      if (key === "panel" && PANELS.indexOf(value) !== -1) {
        state.panel = value;
      } else if (key === "lang") {
        state.lang = value;
      } else if (key === "f") {
        state.f = value;
      }
    });
    return state;
  }

  function buildHash(state) {
    var parts = ["panel=" + encodeURIComponent(state.panel)];
    if (state.lang) { parts.push("lang=" + encodeURIComponent(state.lang)); }
    if (state.f) { parts.push("f=" + encodeURIComponent(state.f)); }
    return "#" + parts.join("&");
  }

  /* A panel switch is navigation and earns a history entry; a language or
     filter change is a view preference and replaces instead, so the back
     button still leaves the page rather than unwinding a dozen keystrokes
     (design spec section 4). */
  function goTo(state, replaceOnly) {
    var next = buildHash(state);
    if (window.location.hash === next) { render(); return; }
    if (replaceOnly) { window.location.replace(next); return; }
    window.location.hash = next;
  }

  /* Rendering --------------------------------------------------------- */

  function render() {
    var state = parseHash();
    LANG = resolveLang(state.lang, PAYLOAD ? PAYLOAD.lang : null);
    document.documentElement.lang = LANG;
    document.title = t("app.title");
    renderChrome(state);
    renderNav(state);
    renderPanels(state);
    renderFooter();
  }

  function renderChrome(state) {
    document.getElementById("aio-skip").textContent = t("action.skip_to_main");
    document.getElementById("aio-title").textContent = t("app.title");
    document.getElementById("aio-tagline").textContent = t("app.tagline");

    var actions = document.getElementById("aio-actions");
    clear(actions);

    actions.appendChild(h(
      "div",
      { class: "group", role: "group", "aria-label": t("action.language") },
      h("span", { class: "label" }, t("action.language")),
      langButton("en", "action.lang_en", state),
      langButton("pt-BR", "action.lang_pt_br", state)
    ));

    actions.appendChild(h(
      "div",
      { class: "group", role: "group", "aria-label": t("action.density") },
      h("span", { class: "label" }, t("action.density")),
      densityButton("comfortable", "action.density_comfortable"),
      densityButton("compact", "action.density_compact")
    ));

    actions.appendChild(h("p", { class: "hint" }, t("action.palette_hint")));

    document.getElementById("aio-mode").textContent = modeChipText();
  }

  /* Design spec section 4 wants the mode legible in the header, not only in
     the footer: a reader who never scrolls down should still know whether
     what they are looking at was computed or merely injected. Built pages
     show when they were generated; static pages say so in words. */
  function modeChipText() {
    if (PAYLOAD && PAYLOAD.mode === "built") {
      return t("chip.generated") + " " + textOr(PAYLOAD.generated_at);
    }
    if (PAYLOAD && PAYLOAD.mode === "static") { return t("chip.static"); }
    return t("chip.mode_unknown");
  }

  function langButton(code, key, state) {
    var node = h(
      "button",
      { type: "button", lang: code, "aria-pressed": String(code === LANG) },
      t(key)
    );
    node.addEventListener("click", function () {
      store(STORE_LANG, code);
      goTo({ panel: state.panel, lang: code, f: state.f }, true);
    });
    return node;
  }

  function densityButton(value, key) {
    var node = h(
      "button",
      { type: "button", "aria-pressed": String(value === currentDensity()) },
      t(key)
    );
    node.addEventListener("click", function () {
      store(STORE_DENSITY, value);
      applyDensity(value);
      render();
    });
    return node;
  }

  function buildNav() {
    var nav = document.getElementById("aio-nav");
    clear(nav);
    NAV_BUTTONS = PANELS.map(function (panel) {
      var node = h("button", {
        type: "button",
        role: "tab",
        "data-panel": panel,
        "aria-controls": "aio-panel-" + panel,
        "aria-selected": "false",
        tabindex: "-1"
      });
      /* Assigned here rather than through h(): `id` is off the attribute
         allow-list so no ledger string can ever mint one, and the panel
         sections above name these ids in aria-labelledby, so the tab strip
         still owes them. The value is a constant from PANELS -- it is the
         tool naming its own chrome, not content naming anything. */
      node.id = "aio-tab-" + panel;
      node.addEventListener("click", function () {
        goTo({ panel: panel, lang: parseHash().lang, f: parseHash().f }, false);
        node.focus();
      });
      node.addEventListener("keydown", onNavKey);
      nav.appendChild(node);
      return node;
    });
  }

  /* Roving tabindex: the tab strip is one stop in the tab order and the
     arrow keys move within it, which is what a tablist owes a keyboard. */
  function onNavKey(event) {
    var active = parseHash().panel;
    var index = PANELS.indexOf(active);
    var next = null;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (index + 1) % PANELS.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (index + PANELS.length - 1) % PANELS.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = PANELS.length - 1;
    }
    if (next === null) { return; }
    event.preventDefault();
    goTo({ panel: PANELS[next], lang: parseHash().lang, f: parseHash().f }, false);
    NAV_BUTTONS[next].focus();
  }

  function renderNav(state) {
    var nav = document.getElementById("aio-nav");
    nav.hidden = false;
    nav.setAttribute("aria-label", t("action.panels"));
    PANELS.forEach(function (panel, index) {
      var node = NAV_BUTTONS[index];
      if (!node) { return; }
      node.textContent = t("panel." + panel + ".title");
      var selected = panel === state.panel;
      node.setAttribute("aria-selected", String(selected));
      node.setAttribute("tabindex", selected ? "0" : "-1");
    });
  }

  function panelSection(panel) {
    return document.getElementById("aio-panel-" + panel);
  }

  /* Every panel is populated on every render, and only then hidden. That is
     not waste: print correctness depends on it. The print stylesheet unhides
     all nine sections so a printed page is the whole ledger rather than
     whichever tab happened to be open, and it can only unhide sections that
     already have content in them. Do not optimize this loop to render the
     active panel only -- the screen would look identical and the printed
     ledger would quietly lose eight of its nine sections. */
  function renderPanels(state) {
    PANELS.forEach(function (panel) {
      var section = panelSection(panel);
      if (!section) { return; }
      section.hidden = panel !== state.panel;
      clear(section);
      section.appendChild(h("h2", null, t("panel." + panel + ".title")));
      if (panel === "overview") {
        renderOverview(section);
      } else if (panel === "help") {
        renderHelp(section);
      } else {
        /* Tasks 4-5 replace this with the real renderer. Until then a panel
           states what would fill it and the command that does the filling,
           which is what design spec section 4 asks empty states to do. */
        section.appendChild(h("p", { class: "empty" }, t("panel." + panel + ".empty")));
      }
    });
  }

  /* Three branches, not two. The assurance -- "built from a verified
     ledger" -- is the strongest claim this page makes, and it is made only
     when the payload says exactly "built". An `else` would have handed that
     claim to every value that is not "static": a typo, a mode from a newer
     tool, a hand-edited island. Anything unrecognised gets the unverified
     treatment instead, which is the safe direction to be wrong in. */
  function renderOverview(section) {
    if (PAYLOAD.mode === "static") {
      section.appendChild(statusBlock("warning", t("banner.static.title")));
      section.appendChild(h("p", { class: "empty" }, t("banner.static.detail")));
    } else if (PAYLOAD.mode === "built") {
      section.appendChild(statusBlock("info", t("banner.built.title")));
      section.appendChild(h("p", { class: "empty" }, t("banner.built.detail")));
      var age = ageInDays(PAYLOAD.generated_at);
      if (age !== null && age > STALE_AFTER_DAYS) {
        section.appendChild(statusBlock("warning", t("banner.stale")));
      }
    } else {
      section.appendChild(statusBlock("warning", t("banner.mode_unknown.title")));
      section.appendChild(h("p", { class: "empty" }, t("banner.mode_unknown.detail")));
    }

    var degraded = degradedKeys();
    if (degraded.length !== 0) {
      section.appendChild(statusBlock("warning", t("banner.degraded")));
      section.appendChild(h(
        "ul",
        { class: "keys" },
        degraded.map(function (key) { return h("li", null, h("code", null, key)); })
      ));
    }

    if (!PAYLOAD.ledger) {
      section.appendChild(h("p", { class: "empty" }, t("panel.overview.empty")));
    }
  }

  /* Design spec section 14: a sub-computation that failed carries an error
     message instead of a report, and the panel that depends on it must name
     the missing guarantee rather than render a blank that reads as "none". */
  function degradedKeys() {
    var computed = PAYLOAD.computed;
    if (!computed || typeof computed !== "object") { return []; }
    var names = [];
    ["drift", "previews", "expired_evidence", "unreachable_projects"].forEach(function (key) {
      if (isError(computed[key])) { names.push("computed." + key); }
    });
    var previews = computed.previews;
    if (previews && typeof previews === "object" && !isError(previews)) {
      Object.keys(previews).forEach(function (runId) {
        if (isError(previews[runId])) { names.push("computed.previews." + runId); }
      });
    }
    return names;
  }

  function isError(value) {
    return Boolean(value) && typeof value === "object" && typeof value.error === "string";
  }

  /* The Help panel needs no payload: it is dictionary content, so it is
     already final. The canonical state names render as English text with
     their translated gloss beside them -- the gloss is also the tooltip the
     Task 4-5 renderers attach to the same label inline. */
  function renderHelp(section) {
    section.appendChild(h("p", { class: "empty" }, t("panel.help.empty")));
    section.appendChild(h("p", { class: "empty" }, t("help.modes")));
    section.appendChild(h("p", { class: "empty" }, t("help.self_reported")));
    section.appendChild(h("p", { class: "empty" }, t("help.canonical_labels")));

    var list = h("dl", { class: "reference" });
    DRIFT_STATES.concat(ROLLBACK_INDICATORS).forEach(function (state) {
      var tip = t("state." + state + ".tip");
      list.appendChild(h("dt", null, h("code", { lang: "en", title: tip }, state)));
      list.appendChild(h("dd", null, tip));
    });
    section.appendChild(list);
  }

  /* Design spec section 4's staleness deviation: a file: page cannot stat
     the ledger without issuing a request, so the page reports when it was
     generated and how long ago that was, and says plainly that a static
     page shows whatever was last injected. Date.now() at view time is fine
     here -- this is presentation, not evidence. */
  function ageInDays(value) {
    if (typeof value !== "string" || value === "") { return null; }
    var when = Date.parse(value);
    if (isNaN(when)) { return null; }
    return Math.floor((Date.now() - when) / DAY_MS);
  }

  function renderFooter() {
    var list = document.getElementById("aio-footer");
    clear(list);
    var age = ageInDays(PAYLOAD.generated_at);
    [
      [t("footer.version"), textOr(PAYLOAD.tool_version)],
      [t("footer.mode"), textOr(PAYLOAD.mode)],
      [t("footer.generated"), textOr(PAYLOAD.generated_at)],
      [t("footer.age"), age === null ? t("footer.unknown") : String(age)]
    ].forEach(function (pair) {
      list.appendChild(h(
        "div",
        null,
        h("dt", null, pair[0]),
        h("dd", null, pair[1])
      ));
    });
  }

  function textOr(value) {
    return typeof value === "string" && value !== "" ? value : t("footer.unknown");
  }

  /* Failure ----------------------------------------------------------- */

  /* Design spec section 1.1: a payload that cannot be read never falls
     through to a partial render. The panels are removed, not hidden, so
     there is nothing stale left on screen to mistake for data. */
  function fatal(message) {
    var main = document.getElementById("aio-main");
    clear(main);
    main.appendChild(statusBlock("error", message));
    var nav = document.getElementById("aio-nav");
    if (nav) { nav.hidden = true; }
    var footer = document.getElementById("aio-footer");
    if (footer) { clear(footer); }
  }

  function readIsland(id) {
    var node = document.getElementById(id);
    if (!node) { throw new Error("island " + id + " is absent"); }
    return JSON.parse(node.textContent);
  }

  /* Boot -------------------------------------------------------------- */

  try {
    DICTS = readIsland("aio-i18n");
  } catch (err) {
    DICTS = null;
  }

  if (!DICTS || typeof DICTS !== "object" || !DICTS[FALLBACK_LANG]) {
    DICTS = null;
    fatal(LAST_RESORT);
    return;
  }

  applyDensity(currentDensity());
  LANG = resolveLang(parseHash().lang, null);
  document.documentElement.lang = LANG;

  var skip = document.getElementById("aio-skip");
  skip.textContent = t("action.skip_to_main");
  /* The href is a real fragment so the link works without scripting, but
     following it would rewrite the hash the router owns and silently reset
     the open panel, so the handler moves focus directly instead. */
  skip.addEventListener("click", function (event) {
    event.preventDefault();
    document.getElementById("aio-main").focus();
  });

  try {
    PAYLOAD = readIsland("aio-payload");
  } catch (err) {
    fatal(t("banner.parse_error"));
    return;
  }

  if (!PAYLOAD || typeof PAYLOAD !== "object" || Array.isArray(PAYLOAD)) {
    fatal(t("banner.parse_error"));
    return;
  }

  /* Forward compatibility: a payload written by a newer tool may mean
     anything, so an unknown schema is treated exactly like an unreadable
     one rather than being rendered on a guess. */
  if (PAYLOAD.payload_schema !== PAYLOAD_SCHEMA) {
    fatal(t("banner.schema_unknown"));
    return;
  }

  buildNav();
  window.addEventListener("hashchange", render);
  render();
}());
</script>

</body>
</html>
