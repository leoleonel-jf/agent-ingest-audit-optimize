<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Governance ledger</title>
<style>
/* One stylesheet, no font file, no image, nothing to fetch. Every colour is
   a custom property so the dark palette is a swap rather than a second set
   of rules, and every box uses logical properties so a right-to-left
   dictionary would need no CSS at all. */

:root {
  color-scheme: light dark;

  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  --gap: 1.5rem;
  --step: 0.35rem;
  --measure: 68ch;

  /* Light palette. Every ink/background pair below clears WCAG 2.2 AA at
     body size; the muted ink clears it too, so secondary text is readable
     rather than decorative. */
  --bg: #fbfbfa;
  --surface: #ffffff;
  --ink: #1a1a1a;
  --ink-muted: #55524d;
  --rule: #d3d0ca;
  --accent: #1f4f8b;
  --error: #8c1d1d;
  --warning: #6f4a00;
  --info: #2a4b7c;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181a;
    --surface: #1e2124;
    --ink: #ececec;
    --ink-muted: #b3b6b8;
    --rule: #34383c;
    --accent: #8fb8ef;
    --error: #f19a9a;
    --warning: #e2b871;
    --info: #9dbbe8;
  }
}

body[data-density="compact"] {
  --gap: 0.9rem;
  --step: 0.2rem;
}

* { box-sizing: border-box; }

html { background: var(--bg); }

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.55;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

code { font-family: var(--font-mono); font-size: 0.9em; }

[hidden] { display: none !important; }

.skip-link {
  position: absolute;
  inset-block-start: -4rem;
  inset-inline-start: var(--gap);
  z-index: 3;
  padding: 0.4rem 0.7rem;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--accent);
  transition: inset-block-start 120ms ease;
}

.skip-link:focus { inset-block-start: 0.5rem; }

/* Header ------------------------------------------------------------- */

.chrome {
  display: flex;
  flex-wrap: wrap;
  gap: var(--gap);
  align-items: flex-end;
  justify-content: space-between;
  padding: calc(var(--gap) * 1.2) var(--gap) var(--gap);
  border-block-end: 1px solid var(--rule);
}

.chrome h1 {
  margin: 0;
  font-size: 1.2rem;
  font-weight: 600;
  letter-spacing: 0.005em;
}

.tagline {
  margin: var(--step) 0 0;
  max-inline-size: var(--measure);
  color: var(--ink-muted);
  font-size: 0.9rem;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.9rem;
  align-items: center;
}

.group {
  display: flex;
  align-items: center;
  gap: 0.3rem;
}

.group .label {
  color: var(--ink-muted);
  font-size: 0.8rem;
}

.hint {
  margin: 0;
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: 0.78rem;
}

/* The mode chip. Design spec section 4 asks the header to carry a
   generated-at line or a static-mode notice; this is it, kept to one short
   line so the header stays a header. The footer keeps the full detail. */
.chip {
  display: inline-block;
  margin: var(--step) 0 0;
  padding: 0.1rem 0.45rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 2px;
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: 0.75rem;
}

button {
  font: inherit;
  font-size: 0.85rem;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 2px;
  padding: 0.25rem 0.55rem;
  cursor: pointer;
}

button[aria-pressed="true"] {
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}

/* Panel navigation ---------------------------------------------------- */

.panels {
  position: sticky;
  inset-block-start: 0;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  gap: 0.2rem;
  padding: 0.45rem var(--gap);
  background: var(--bg);
  border-block-end: 1px solid var(--rule);
}

.panels button {
  background: transparent;
  border-color: transparent;
  padding: 0.3rem 0.65rem;
}

.panels button[aria-selected="true"] {
  background: var(--surface);
  border-color: var(--rule);
  color: var(--accent);
  font-weight: 600;
}

/* Panels -------------------------------------------------------------- */

main { padding: var(--gap); }
main:focus { outline: none; }

.panel { max-inline-size: var(--measure); }

.panel h2 {
  margin: 0 0 var(--step);
  font-size: 1.05rem;
  font-weight: 600;
}

.empty {
  margin: 0 0 var(--gap);
  color: var(--ink-muted);
}

.reference {
  margin: 0 0 var(--gap);
}

.reference dt {
  margin-block-start: var(--step);
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 600;
}

.reference dd {
  margin: 0 0 var(--step);
  margin-inline-start: 0;
  color: var(--ink-muted);
}

/* Status blocks. Severity is carried by a glyph and a word as well as by
   the rule colour, so nothing depends on seeing the hue. */

.status {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.5rem;
  margin: 0 0 var(--gap);
  padding: 0.55rem 0.75rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-inline-start: 3px solid var(--rule);
}

.status .status-label {
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  font-size: 0.78rem;
}

.status .status-text { flex: 1 1 20ch; }

.status-error { border-inline-start-color: var(--error); }
.status-error .glyph,
.status-error .status-label { color: var(--error); }

.status-warning { border-inline-start-color: var(--warning); }
.status-warning .glyph,
.status-warning .status-label { color: var(--warning); }

.status-info { border-inline-start-color: var(--info); }
.status-info .glyph,
.status-info .status-label { color: var(--info); }

.keys {
  margin: 0;
  padding-inline-start: 1.2rem;
  color: var(--ink-muted);
}

.note {
  margin: 0 0 var(--step);
  color: var(--ink-muted);
  font-size: 0.85rem;
}

/* Indicator cards ------------------------------------------------------
   One card per overview indicator: glyph, count, label, and a note. The
   severity reaches the reader three ways -- shape, word, and hue -- so the
   card is still readable in greyscale (design spec section 7, acceptance
   item 3). Each card is a link to the panel that details it. */

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
  gap: 0.7rem;
  margin: 0 0 var(--gap);
  padding: 0;
  list-style: none;
}

.card {
  padding: 0.55rem 0.75rem;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-inline-start: 3px solid var(--rule);
}

.card-link {
  display: block;
  color: inherit;
  text-decoration: none;
}

.card-link:hover .card-label { text-decoration: underline; }

.card-count {
  font-family: var(--font-mono);
  font-size: 1.3rem;
  font-weight: 600;
}

.card-label {
  display: block;
  font-size: 0.9rem;
}

.card-note {
  margin: var(--step) 0 0;
  color: var(--ink-muted);
  font-size: 0.78rem;
}

.unavailable {
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: 0.95rem;
  font-weight: 600;
}

.card-error { border-inline-start-color: var(--error); }
.card-error .glyph,
.card-error .card-count { color: var(--error); }

.card-warning { border-inline-start-color: var(--warning); }
.card-warning .glyph,
.card-warning .card-count { color: var(--warning); }

.card-info { border-inline-start-color: var(--info); }
.card-info .glyph,
.card-info .card-count { color: var(--info); }

/* Filter bar ----------------------------------------------------------- */

.filters {
  position: sticky;
  inset-block-start: 2.6rem;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.3rem;
  margin: 0 0 var(--gap);
  padding: 0.4rem 0;
  background: var(--bg);
  border-block-end: 1px solid var(--rule);
}

.filter-label {
  color: var(--ink-muted);
  font-size: 0.8rem;
}

/* Tables ---------------------------------------------------------------
   The record panels are wide by nature, so a panel that carries one opts
   out of the prose measure rather than squeezing six columns into 68ch.
   Below the breakpoint further down, these same rows fold into cards. */

.panel[data-wide="true"] { max-inline-size: none; }

.panel h3 {
  margin: var(--gap) 0 var(--step);
  font-size: 0.95rem;
  font-weight: 600;
}

.grid-table {
  inline-size: 100%;
  margin: 0 0 var(--gap);
  border-collapse: collapse;
  font-size: 0.9rem;
}

.grid-table caption {
  margin-block-end: var(--step);
  color: var(--ink-muted);
  font-size: 0.8rem;
  text-align: start;
}

.grid-table th,
.grid-table td {
  padding: 0.35rem 0.6rem;
  text-align: start;
  vertical-align: top;
  border-block-end: 1px solid var(--rule);
}

.grid-table th {
  color: var(--ink-muted);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

/* The severity rule sits on the row's first cell rather than on the row:
   under border-collapse a `tr` border is not painted reliably, and the
   first cell is the inline-start edge in either writing direction. */
.row-error > td:first-child { border-inline-start: 3px solid var(--error); }
.row-warning > td:first-child { border-inline-start: 3px solid var(--warning); }
.row-info > td:first-child { border-inline-start: 3px solid var(--info); }
.row-focus > td:first-child { border-inline-start-width: 7px; }

/* Canonical vocabulary --------------------------------------------------
   Design spec section 5: the token stays English and mono, the gloss is
   the translated tooltip, and the glyph carries the severity. */

.vocab {
  display: inline-flex;
  align-items: baseline;
  gap: 0.25rem;
  white-space: nowrap;
}

.vocab code { font-weight: 600; }

.vocab-error .glyph,
.vocab-error code { color: var(--error); }

.vocab-warning .glyph,
.vocab-warning code { color: var(--warning); }

.vocab-info .glyph,
.vocab-info code { color: var(--info); }

.marker {
  display: inline-flex;
  align-items: baseline;
  gap: 0.25rem;
  color: var(--warning);
  font-size: 0.8rem;
  font-weight: 600;
}

.evidence {
  margin: 0;
  padding-inline-start: 1.1rem;
}

/* An evidence source is frequently a URL, and it is rendered as text on
   purpose (design spec section 1.3): it wraps anywhere so a long one does
   not push the table wider than the viewport. */
.source,
.path {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  overflow-wrap: anywhere;
}

/* Footer -------------------------------------------------------------- */

footer {
  margin-block-start: calc(var(--gap) * 2);
  padding: var(--gap);
  border-block-start: 1px solid var(--rule);
  color: var(--ink-muted);
  font-size: 0.85rem;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.2rem 1.75rem;
  margin: 0;
}

.meta div { display: flex; gap: 0.4rem; }
.meta dt { font-weight: 600; }
.meta dd { margin: 0; margin-inline-start: 0; font-family: var(--font-mono); }

/* Narrow widths. The document is a single column already; below the
   breakpoint the tables Tasks 4-5 add fold into labelled cards, and the
   panel bar stops sticking so it never eats a short viewport. */

@media (max-width: 720px) {
  :root { --gap: 1rem; }

  .chrome { align-items: flex-start; }
  .panels { position: static; }
  .filters { position: static; }
  .cards { grid-template-columns: 1fr; }

  .grid-table thead {
    position: absolute;
    inline-size: 1px;
    block-size: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }

  .grid-table tr {
    display: block;
    margin-block-end: var(--gap);
    padding: 0.5rem;
    border: 1px solid var(--rule);
  }

  .grid-table td {
    display: flex;
    gap: 0.75rem;
    justify-content: space-between;
    padding: 0.1rem 0;
    border: 0;
  }

  .grid-table td::before {
    content: attr(data-label);
    color: var(--ink-muted);
    font-weight: 600;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Print: black on white, no controls, every panel in document order so the
   PDF is the whole ledger rather than whichever tab was open.

   Print correctness requires every panel section to be populated on every
   render, not just the active one: this block unhides all nine, and it can
   only unhide what already has content in it. Do not optimize renderPanels
   to render the active panel only -- the printed ledger would silently lose
   eight of its nine sections, and no test that inspects the screen would
   notice. The same warning sits on renderPanels itself. */

@media print {
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --ink: #000000;
    --ink-muted: #2b2b2b;
    --rule: #8a8a8a;
    --accent: #000000;
    --error: #000000;
    --warning: #000000;
    --info: #000000;
  }

  .skip-link,
  .panels,
  .filters,
  .actions { display: none !important; }

  body { background: #ffffff; color: #000000; font-size: 11pt; }
  main { padding: 0; }

  .panel[hidden] { display: block !important; }

  .panel {
    max-inline-size: none;
    margin-block-end: 1.5rem;
    break-inside: avoid;
  }
}
</style>
</head>

</footer>

<script>
/* The shell.

   Three rules hold this file together, and the static suite
   (dashboard/tests/test_shell.py) pins all three by reading this source
   rather than by rendering it:

   1. Ledger content enters through exactly one place, the JSON island above,
      and leaves through exactly one place, h() below. Text always lands as a
      text node or a textContent assignment. No markup is ever assembled from
      a string, which is why none of the DOM sinks the suite greps for
      appears anywhere in this file -- not in code, and not in these comments
      either, since that grep is deliberately unconditional.

   2. Every user-visible string comes from the dictionaries. The one
      exception is LAST_RESORT, which exists precisely for the case where the
      dictionaries cannot be read.

   3. The page asks for nothing. No fetch, no image, no font, no timer that
      takes a string. Opening this file offline and opening it online produce
      the same document. */

(function () {
  "use strict";

  var PAYLOAD_SCHEMA = 1;

  /* Panel order is the reading order of the whole tool: what happened, what
     exists, what changed, where it came from, how to undo it, what was
     deferred, what was decided, what it rests on, how to read any of it. */
  const PANELS = [
    "overview",
    "inventory",
    "changes",
    "provenance",
    "rollback",
    "backlog",
    "decisions",
    "materials",
    "help"
  ];

  var DEFAULT_PANEL = "overview";
  var FALLBACK_LANG = "en";
  var STALE_AFTER_DAYS = 7;
  var DAY_MS = 86400000;
  var DENSITIES = ["comfortable", "compact"];
  var STORE_LANG = "aio.lang";
  var STORE_DENSITY = "aio.density";

  /* The canonical vocabulary, English on screen in every language (design
     spec section 5). Held here as data so the Help panel and the Task 4-5
     renderers name the same eight states from one list. */
  var DRIFT_STATES = ["IN_PLACE", "DRIFTED", "REVERTED", "MISSING", "UNVERIFIABLE"];
  var ROLLBACK_INDICATORS = ["HEALTHY", "AT_RISK", "BROKEN"];

  /* Functional glyphs, not decoration: severity must be legible without
     colour (design spec section 7, acceptance item 3), so every status
     carries a shape and a word as well as a hue. */
  var GLYPHS = { error: "✕", warning: "▲", info: "●" };

  /* Severity, worst first. The rank *is* the index, so this array is the
     whole ordering rule: there is no second list anywhere in this file, and
     `sortBySeverityThenRecency` is the one place it is applied. */
  var SEVERITY_ORDER = ["error", "warning", "info"];

  /* The five drift states as severities. DRIFTED and MISSING both mean this
     ledger no longer describes what is on disk, which is precisely the
     finding the drift machinery exists to surface; UNVERIFIABLE means nobody
     could tell, which is a warning rather than a failure; the other two are
     the quiet outcomes. Mapping a drifted item to `info` would sort it below
     a note and paint it like one -- a silent downgrade. */
  var DRIFT_SEVERITY = {
    IN_PLACE: "info",
    DRIFTED: "error",
    REVERTED: "info",
    MISSING: "error",
    UNVERIFIABLE: "warning"
  };

  /* The three rollback indicators, same three words. */
  var INDICATOR_SEVERITY = {
    HEALTHY: "info",
    AT_RISK: "warning",
    BROKEN: "error"
  };

  /* The date fields a row may carry, in the order recency prefers them.
     Every date this ledger stores is YYYY-MM-DD, which sorts
     lexicographically in date order, so the comparison needs no parsing and
     no Date object -- and cannot be wrong about a timezone. */
  var DATE_FIELDS = [
    "updated", "revisit_after", "captured_on", "expires_on", "created"
  ];

  /* A run that was undone. The schema spells the two halves differently --
     the record's `status` and the run's `result` -- and either one is enough
     to say the change is no longer in effect. */
  var ROLLED_BACK_STATUS = "ROLLBACK";
  var ROLLED_BACK_RESULT = "ROLLBACK COMPLETED";

  /* The separator the lookup keys below are joined on: U+0000, which no
     path, name, kind, or evidence source can contain. With a printable
     separator two different items could concatenate into the same key and
     silently share one drift state or one expiry marker. Built with
     fromCharCode rather than written out so this template stays plain text
     that a diff, an editor, and `grep` all treat as text. */
  var SEPARATOR = String.fromCharCode(0);

  /* The remaining closed vocabularies, from ledger.schema.json. They are
     here for the same reason DRIFT_STATES is: the Help panel glosses them
     and the record panels use the same glosses as tooltips, from one list. */
  var CLASSIFICATIONS = [
    "ADOPT GLOBALLY",
    "ADOPT AS A DEFAULT FOR NEW PROJECTS",
    "MIGRATE EXISTING PROJECTS",
    "ADOPT LOCALLY",
    "TEST IN ISOLATION",
    "ADAPT",
    "MONITOR",
    "REJECT",
    "OBSOLETE",
    "ALREADY IMPLEMENTED",
    "NOT APPLICABLE",
    "NEEDS MORE EVIDENCE",
    "RISK EXCEEDS BENEFIT"
  ];

  var RECORD_STATUSES = [
    "ANALYZED",
    "PROPOSED",
    "DECIDED",
    "IMPLEMENTED",
    "VALIDATED",
    "VALIDATED WITH CAVEATS",
    "NOT IMPLEMENTED",
    "PENDING",
    "ROLLBACK",
    "SUPERSEDED"
  ];

  /* Help's command examples. English in every language, like the rest of the
     tool's vocabulary: the reader types these, and a translated command is a
     command that does not run. */
  var COMMANDS = [
    ["dashboard.py verify LEDGER", "help.cmd.verify"],
    ["dashboard.py scan CLIENT --project ROOT", "help.cmd.scan"],
    ["dashboard.py drift LEDGER", "help.cmd.drift"],
    ["dashboard.py rollback-preview LEDGER RUN-ID", "help.cmd.rollback_preview"],
    ["dashboard.py build LEDGER", "help.cmd.build"]
  ];

  /* The only English sentence in this file. If the dictionary island itself
     cannot be read there is no key left to look a message up by, and saying
     nothing would leave a blank page that looks merely empty. */

    }

    if (!PAYLOAD.ledger) {
      section.appendChild(h("p", { class: "empty" }, t("panel.overview.empty")));
      return;
    }

    renderIndicatorCards(section);
  }

  /* Design spec section 12.1's overview: one card per indicator, each with a
     glyph, a count, a label, and a link to the panel that details it.

     Two of the five are answerable from the ledger alone -- a RUN record
     says whether it was rolled back, and a known project records the status
     something last observed for it -- so those hold a number on a static
     page too. The other three are guarantees only dashboard.py can make:
     drift compares digests against disk, rollback-preview verifies a backup,
     and expiry is compared against the date the build ran. Those three say
     "unavailable" and name the command that would fill them, because a zero
     there reads as "nothing is wrong" and would be a lie. */
  function renderIndicatorCards(section) {
    var drift = computedFor("drift");
    var previews = computedFor("previews");
    var expired = computedFor("expired_evidence");
    var unreachable = unreachableProjects();
    var driftCount = drift === null ? null : driftIndicator(drift);
    var previewCount = previews === null ? null : previewIndicator(previews);

    var cards = h("ul", { class: "cards" });
    cards.appendChild(indicatorCard(
      "card.active_changes", "changes",
      { count: countActiveChanges(), severity: "info" }, null
    ));
    cards.appendChild(indicatorCard(
      "card.drift", "inventory", driftCount,
      unavailableNoteKey("drift", "card.unavailable.drift")
    ));
    cards.appendChild(indicatorCard(
      "card.rollbacks_at_risk", "rollback", previewCount,
      unavailableNoteKey("previews", "card.unavailable.previews")
    ));
    cards.appendChild(indicatorCard(
      "card.expired_evidence", "materials",
      expired === null ? null : listIndicator(expired),
      unavailableNoteKey("expired_evidence", "card.unavailable.expired_evidence")
    ));
    /* The one card whose detail is on this very panel: there is no Projects
       panel, and the roots are listed directly below the cards. The link
       still names a panel so every card behaves the same way. */
    cards.appendChild(indicatorCard(
      "card.unreachable_projects", "overview", listIndicator(unreachable), null
    ));
    section.appendChild(h("h3", null, t("overview.cards")));
    section.appendChild(cards);

    if (unreachable.length !== 0) {
      section.appendChild(h("h3", null, t("overview.unreachable")));
      section.appendChild(h("ul", { class: "keys" }, unreachable.map(function (root) {
        return h("li", null, h("code", { class: "path" }, root));
      })));
    }
  }

  function indicatorCard(labelKey, panel, indicator, unavailableKey) {
    var missing = indicator === null;
    var severity = missing ? "info" : indicator.severity;
    return h(
      "li",
      { class: "card card-" + severity },
      h(
        "a",
        { class: "card-link", href: "#panel=" + panel },
        h("span", { class: "glyph", "aria-hidden": "true" }, GLYPHS[severity]),
        " ",
        missing
          ? h("span", { class: "unavailable" }, t("card.unavailable"))
          : h("span", { class: "card-count" }, String(indicator.count)),
        h("span", { class: "card-label" }, t(labelKey))
      ),
      h(
        "p",
        { class: "card-note" },
        missing ? t(unavailableKey) : t(labelKey + ".note")
      )
    );
  }

  /* The drift summary counts every state, IN_PLACE included. What belongs on
     an indicator card is what is not fine, so the quiet states are skipped
     rather than added and then subtracted, and the card's own severity is
     the worst state that actually has a count. */
  function driftIndicator(report) {
    var summary = report && typeof report === "object" ? report.summary : null;
    var total = 0;
    var worst = "info";
    if (summary && typeof summary === "object") {
      Object.keys(summary).forEach(function (state) {
        var count = summary[state];
        var severity = DRIFT_SEVERITY[state];
        if (typeof count !== "number" || count === 0) { return; }
        if (severity === undefined || severity === "info") { return; }
        total += count;
        if (severityRank(severity) < severityRank(worst)) { worst = severity; }
      });
    }
    return { count: total, severity: worst };
  }

  function previewIndicator(previews) {
    var total = 0;
    var worst = "info";
    Object.keys(previews).forEach(function (runId) {
      var preview = previews[runId];
      if (!preview || typeof preview !== "object") { return; }
      var severity = INDICATOR_SEVERITY[preview.indicator];
      if (severity === undefined || severity === "info") { return; }
      total += 1;
      if (severityRank(severity) < severityRank(worst)) { worst = severity; }
    });
    return { count: total, severity: worst };
  }

  /* Two different absences, and a reader should be able to tell them apart.
     "This page never computed it" is a static page and one command away;
     "this computation failed while the page was built" is a broken build,
     and rerunning the same command may not fix it. Both show no number --
     that part is not negotiable, since a zero would read as an all-clear. */
  function unavailableNoteKey(key, commandKey) {
    var computed = PAYLOAD.computed;
    if (computed && typeof computed === "object" && isError(computed[key])) {
      return "card.degraded";
    }
    return commandKey;
  }

  function listIndicator(values) {
    var count = Array.isArray(values) ? values.length : 0;
    return { count: count, severity: count === 0 ? "info" : "warning" };
  }

  function countActiveChanges() {
    return records("RUN").filter(function (record) {
      return record.status !== ROLLED_BACK_STATUS
        && record.result !== ROLLED_BACK_RESULT;
    }).length;
  }

  /* A built page asks the filesystem; a static page cannot, but the ledger
     carries the status something recorded the last time it looked, and
     reporting that is honest in a way reporting zero would not be. */
  function unreachableProjects() {
    var listed = computedFor("unreachable_projects");
    if (Array.isArray(listed)) {
      return listed.filter(function (root) { return typeof root === "string"; });
    }
    var roots = [];
    ledgerList("known_projects").forEach(function (entry) {
      if (!entry || typeof entry !== "object") { return; }
      if (entry.status === "UNREACHABLE" && typeof entry.project_root === "string") {
        roots.push(entry.project_root);
      }
    });
    return roots;
  }

  /* Inventory ---------------------------------------------------------- */

  /* Every item every baseline recorded, one row each, filtered by kind.

     The `state` column carries two different facts and must not blur them.
     A baseline item's own `state` is scan-verified data -- what was on disk
     when the baseline was captured -- so it renders plainly. A drift state
     is a comparison this build performed just now, so it renders as a chip
     with its gloss and its severity. Neither is self-reported, and neither
     wears that marker; the SELF-REPORTED badge belongs to run records, which
     is Task 5's panel. */
  function renderInventory(section, state) {
    var drift = computedFor("drift");
    var kinds = [];
    var rows = [];

    ledgerList("baselines").forEach(function (entry) {
      if (!entry || typeof entry !== "object") { return; }
      var states = driftStatesFor(drift, entry.id);
      var items = Array.isArray(entry.items) ? entry.items : [];
      items.forEach(function (item) {
        if (!item || typeof item !== "object") { return; }
        if (typeof item.kind === "string" && kinds.indexOf(item.kind) === -1) {
          kinds.push(item.kind);
        }
        var found = states[itemKey(item)];
        rows.push({
          item: item,
          captured_on: typeof entry.captured_on === "string" ? entry.captured_on : null,
          drift: typeof found === "string" ? found : null
        });
      });
    });

    if (rows.length === 0) {
      section.appendChild(h("p", { class: "empty" }, t("panel.inventory.empty")));
      return;
    }

    kinds.sort();
    /* One `f` key serves every panel, so a value left over from another
       panel's filter would empty this table for no reason the reader can
       see. An `f` that names no kind here simply means "all". */
    var wanted = kinds.indexOf(state.f) === -1 ? "" : state.f;
    section.appendChild(filterBar(
      { panel: state.panel, lang: state.lang, f: wanted },
      kinds,
      "filter.kind"
    ));

    var visible = wanted === "" ? rows : rows.filter(function (entry) {
      return entry.item.kind === wanted;
    });
    var sorted = sortBySeverityThenRecency(visible, inventorySeverity);

    wide(section);
    section.appendChild(gridTable(
      "inventory.caption",
      [
        "table.kind", "table.name", "table.anchor",
        "table.state", "table.origin", "table.portable"
      ],
      sorted.map(inventoryRow)
    ));
  }

  function inventorySeverity(entry) {
    if (entry.drift === null) { return "info"; }
    var severity = DRIFT_SEVERITY[entry.drift];
    /* A state this page does not know is not quietly a note: an unknown
       classification is exactly the case where the reader should look. */
    return severity === undefined ? "warning" : severity;
  }

  function inventoryRow(entry) {
    var item = entry.item;
    return tableRow(inventorySeverity(entry), false, [
      cell("table.kind", h("code", { lang: "en" }, textOrDash(item.kind))),
      cell("table.name", textOrDash(item.name)),
      cell("table.anchor", h("code", { class: "path" }, textOrDash(item.anchor))),
      cell("table.state", inventoryStateCell(entry)),
      cell("table.origin", h("code", { lang: "en" }, textOrDash(item.origin))),
      cell("table.portable", flagText(item.portable))
    ]);
  }

  function inventoryStateCell(entry) {
    if (entry.drift === null) {
      return h("code", { lang: "en" }, textOrDash(entry.item.state));
    }
    return vocabChip(
      entry.drift,
      inventorySeverity(entry),
      "state." + entry.drift + ".tip"
    );
  }

  /* The join. The drift report keeps one entry per baseline, each holding
     one row per item, and every row repeats the item's kind, name, and
     anchor -- which together identify an item inside its baseline. Joining
     on those three rather than on position means a report computed before
     the ledger gained an item still lines up, and a row that does not line
     up has no state at all rather than borrowing its neighbour's. */
  function driftStatesFor(report, baselineId) {
    var found = {};
    if (!report || typeof report !== "object") { return found; }
    var entries = Array.isArray(report.baselines) ? report.baselines : [];
    entries.forEach(function (entry) {
      if (!entry || typeof entry !== "object" || entry.id !== baselineId) { return; }
      var items = Array.isArray(entry.items) ? entry.items : [];
      items.forEach(function (item) {
        if (item && typeof item === "object") { found[itemKey(item)] = item.state; }
      });
    });
    return found;
  }

  function itemKey(item) {
    return [item.kind, item.name, item.anchor].join(SEPARATOR);
  }

  /* Backlog ------------------------------------------------------------ */

  function renderBacklog(section) {
    var entries = ledgerList("backlog").filter(function (entry) {
      return Boolean(entry) && typeof entry === "object";
    });
    if (entries.length === 0) {
      section.appendChild(h("p", { class: "empty" }, t("panel.backlog.empty")));
      return;
    }
    var today = todayISO();
    var sorted = sortBySeverityThenRecency(entries, function (entry) {
      return backlogSeverity(entry, today);
    });
    wide(section);
    section.appendChild(gridTable(
      "backlog.caption",
      ["table.record", "table.classification", "table.reason", "table.revisit"],
      sorted.map(function (entry) { return backlogRow(entry, today); })
    ));
  }

  /* A revisit date that has passed is the backlog's only finding: the entry
     asked to be looked at again by then and nobody has. Everything else here
     is a note -- a deferred finding is not a fault. */
  function backlogSeverity(entry, today) {
    var when = entry.revisit_after;
    if (typeof when === "string" && when !== "" && when < today) { return "warning"; }
    return "info";
  }

  function backlogRow(entry, today) {
    var severity = backlogSeverity(entry, today);
    var revisit = [];
    if (typeof entry.revisit_trigger === "string" && entry.revisit_trigger !== "") {
      revisit.push(h("p", { class: "note" }, entry.revisit_trigger));
    }
    if (typeof entry.revisit_after === "string" && entry.revisit_after !== "") {
      revisit.push(h("p", { class: "note" }, entry.revisit_after));
      if (severity === "warning") { revisit.push(marker("backlog.revisit_due")); }
    } else {
      revisit.push(h("p", { class: "note" }, t("backlog.trigger_only")));
    }
    return tableRow(severity, false, [
      cell("table.record", h("code", { lang: "en" }, textOrDash(entry.id))),
      cell("table.classification", classificationChip(entry.classification, severity)),
      cell("table.reason", textOrDash(entry.reason)),
      cell("table.revisit", revisit)
    ]);
  }

  /* Decisions ---------------------------------------------------------- */

  /* Design spec section 4: ADR records are never filtered out of this panel,
     only sorted. The fragment's filter therefore does not hide anything
     here -- it names one record and lifts it to the top, which is what a
     "superseded by" link needs to do without making the rest disappear. */
  function renderDecisions(section, state) {
    var adrs = records("ADR");
    if (adrs.length === 0) {
      section.appendChild(h("p", { class: "empty" }, t("panel.decisions.empty")));
      return;
    }
    var replaced = supersessionIndex(adrs);
    /* Every ADR is a note, a superseded one included: a decision that was
       replaced is history, not a fault, and giving it a warning would float
       it above live decisions in a sort that means severity. Recency is what
       separates them, and that is this sort's second key. */
    var sorted = sortBySeverityThenRecency(adrs, function () { return "info"; });
    var focused = [];
    var rest = [];
    sorted.forEach(function (record) {
      if (state.f !== "" && record.id === state.f) { focused.push(record); return; }
      rest.push(record);
    });
    wide(section);
    section.appendChild(gridTable(
      "decisions.caption",
      [
        "table.record", "table.title", "table.status",
        "table.updated", "table.links"
      ],
      focused.concat(rest).map(function (record) {
        return decisionRow(record, replaced, focused.indexOf(record) !== -1);
      })
    ));
  }

  /* Which record replaced which. A record whose own status is SUPERSEDED
     names its replacement in links.adrs; the reverse direction has to be
     built here rather than read, because the replacement itself records
     nothing about what it displaced. */
  function supersessionIndex(adrs) {
    var index = {};
    adrs.forEach(function (record) {
      if (record.status !== "SUPERSEDED") { return; }
      linkedAdrs(record).forEach(function (other) {
        if (!index[other]) { index[other] = []; }
        index[other].push(record.id);
      });
    });
    return index;
  }

  function linkedAdrs(record) {
    var links = record.links;
    if (!links || typeof links !== "object") { return []; }
    var listed = links.adrs;
    if (!Array.isArray(listed)) { return []; }
    return listed.filter(function (value) {
      return typeof value === "string" && value !== "";
    });
  }

  function decisionRow(record, replaced, focused) {
    var links = [];
    if (record.status === "SUPERSEDED") {
      linkedAdrs(record).forEach(function (other) {
        links.push(h(
          "p",
          { class: "note" },
          t("decisions.superseded_by") + " ",
          recordLink(other)
        ));
      });
    }
    (replaced[record.id] || []).forEach(function (other) {
      links.push(h(
        "p",
        { class: "note" },
        t("decisions.supersedes") + " ",
        recordLink(other)
      ));
    });
    return tableRow("info", focused, [
      cell("table.record", h("code", { lang: "en" }, textOrDash(record.id))),
      cell("table.title", textOrDash(record.title)),
      cell("table.status", statusChip(record.status, "info")),
      cell("table.updated", textOrDash(record.updated)),
      cell("table.links", links.length === 0 ? t("value.unknown") : links)
    ]);
  }

  /* An in-page link and nothing else: it names this panel and one record, so
     following it lifts that record to the top of this same table. safeHref
     sees a fragment and passes it through; there is no other shape a record
     link can take on this page. */
  function recordLink(other) {
    return h(
      "a",
      { href: "#panel=decisions&f=" + encodeURIComponent(other), lang: "en" },
      h("code", null, other)
    );
  }

  /* Materials ---------------------------------------------------------- */

  function renderMaterials(section) {
    var materials = records("MATERIAL");
    if (materials.length === 0) {
      section.appendChild(h("p", { class: "empty" }, t("panel.materials.empty")));
      return;
    }
    var expired = expiredEvidenceIndex();
    var sorted = sortBySeverityThenRecency(materials, function (record) {
      return materialSeverity(record, expired);
    });
    section.appendChild(h("p", { class: "note" }, t("materials.source_is_text")));
    if (expired === null) {
      section.appendChild(h("p", { class: "note" }, t("materials.expiry_unchecked")));
    }
    wide(section);
    section.appendChild(gridTable(
      "materials.caption",
      [
        "table.record", "table.title", "table.status",
        "table.classification", "table.evidence"
      ],
      sorted.map(function (record) { return materialRow(record, expired); })
    ));
  }

  /* Expiry is a comparison the build made against the date it ran, and this
     page does not redo it: recomputing at view time would answer a different
     question from the one dashboard.py answered and then quietly disagree
     with the command. Null means the comparison is not on this page at all,
     which the panel states in words rather than by showing every entry as
     current. */
  function expiredEvidenceIndex() {
    var listed = computedFor("expired_evidence");
    if (!Array.isArray(listed)) { return null; }
    var found = {};
    listed.forEach(function (entry) {
      if (entry && typeof entry === "object") {
        found[evidenceKey(entry.record, entry.source)] = true;
      }
    });
    return found;
  }

  function evidenceKey(recordId, source) {
    return [recordId, source].join(SEPARATOR);
  }

  function evidenceOf(record) {
    var listed = record.evidence;
    if (!Array.isArray(listed)) { return []; }
    return listed.filter(function (item) {
      return Boolean(item) && typeof item === "object";
    });
  }

  function isExpiredEvidence(record, item, expired) {
    if (expired === null) { return false; }
    return Boolean(expired[evidenceKey(record.id, item.source)]);
  }

  function materialSeverity(record, expired) {
    var severity = "info";
    evidenceOf(record).forEach(function (item) {
      if (isExpiredEvidence(record, item, expired)) { severity = "warning"; }
    });
    return severity;
  }

  function materialRow(record, expired) {
    var list = h("ul", { class: "evidence" });
    evidenceOf(record).forEach(function (item) {
      list.appendChild(h(
        "li",
        null,
        /* Design spec section 1.3: an evidence source is text. It is
           frequently an address, and it is never made clickable -- this page
           issues no request, and a live source would be one waiting to
           happen. Rendering it as text also keeps it copyable, which is what
           a reader chasing the claim actually needs. */
        h("span", { class: "source" }, textOrDash(item.source)),
        " ",
        h("span", { class: "note" }, textOrDash(item.kind)),
        " ",
        h(
          "span",
          { class: "note" },
          t("materials.verified_on") + " " + textOrDash(item.verified_on)
        ),
        typeof item.expires_on === "string" && item.expires_on !== ""
          ? h(
              "span",
              { class: "note" },
              " " + t("materials.expires_on") + " " + item.expires_on
            )
          : null,
        isExpiredEvidence(record, item, expired) ? marker("materials.expired") : null
      ));
    });
    return tableRow(materialSeverity(record, expired), false, [
      cell("table.record", h("code", { lang: "en" }, textOrDash(record.id))),
      cell("table.title", textOrDash(record.title)),
      cell("table.status", statusChip(record.status, "info")),
      cell("table.classification", classificationChip(record.classification, "info")),
      cell(
        "table.evidence",
        evidenceOf(record).length === 0 ? t("value.unknown") : list
      )
    ]);
  }

  /* Design spec section 14: a sub-computation that failed carries an error
     message instead of a report, and the panel that depends on it must name
     the missing guarantee rather than render a blank that reads as "none". */
  function degradedKeys() {
    var computed = PAYLOAD.computed;
    if (!computed || typeof computed !== "object") { return []; }
    var names = [];
    ["drift", "previews", "expired_evidence", "unreachable_projects"].forEach(function (key) {
      if (isError(computed[key])) { names.push("computed." + key); }
    });
    var previews = computed.previews;
    if (previews && typeof previews === "object" && !isError(previews)) {
      Object.keys(previews).forEach(function (runId) {
        if (isError(previews[runId])) { names.push("computed.previews." + runId); }
      });
    }
    return names;
  }

  function isError(value) {
    return Boolean(value) && typeof value === "object" && typeof value.error === "string";
  }

  /* The Help panel needs no payload: it is dictionary content, so it is
     already final. The canonical state names render as English text with
     their translated gloss beside them -- the gloss is also the tooltip the
     Task 4-5 renderers attach to the same label inline. */
  function renderHelp(section) {
    section.appendChild(h("p", { class: "empty" }, t("panel.help.empty")));
    section.appendChild(h("p", { class: "empty" }, t("help.modes")));
    section.appendChild(h("p", { class: "empty" }, t("help.self_reported")));
    section.appendChild(h("p", { class: "empty" }, t("help.canonical_labels")));

    section.appendChild(h("h3", null, t("help.states")));
    section.appendChild(glossary(
      DRIFT_STATES.concat(ROLLBACK_INDICATORS),
      function (name) { return "state." + name + ".tip"; }
    ));

    section.appendChild(h("h3", null, t("help.classifications")));
    section.appendChild(glossary(
      CLASSIFICATIONS,
      function (name) { return "vocab.class." + name + ".tip"; }
    ));

    section.appendChild(h("h3", null, t("help.statuses")));
    section.appendChild(glossary(
      RECORD_STATUSES,
      function (name) { return "vocab.status." + name + ".tip"; }
    ));

    /* Commands, not prose: the entries stay English while their one-line
       descriptions are translated, for the reason help.canonical_labels
       states -- a translated command is a command that does not run. */
    section.appendChild(h("h3", null, t("help.commands")));
    var commands = h("dl", { class: "reference" });
    COMMANDS.forEach(function (pair) {
      commands.appendChild(h("dt", null, h("code", { lang: "en" }, pair[0])));
      commands.appendChild(h("dd", null, t(pair[1])));
    });
    section.appendChild(commands);
  }

  /* The same two-column shape for all three vocabularies: the canonical
     English term, and its gloss both beside it and as its tooltip -- which
     is the same string the record panels attach to the same term inline. */
  function glossary(names, keyFor) {
    var list = h("dl", { class: "reference" });
    names.forEach(function (name) {
      var tip = t(keyFor(name));
      list.appendChild(h("dt", null, h("code", { lang: "en", title: tip }, name)));
      list.appendChild(h("dd", null, tip));
    });
    return list;
  }

  /* Design spec section 4's staleness deviation: a file: page cannot stat
     the ledger without issuing a request, so the page reports when it was
     generated and how long ago that was, and says plainly that a static
     page shows whatever was last injected. Date.now() at view time is fine
     here -- this is presentation, not evidence. */
  function ageInDays(value) {
    if (typeof value !== "string" || value === "") { return null; }
    var when = Date.parse(value);
    if (isNaN(when)) { return null; }
    return Math.floor((Date.now() - when) / DAY_MS);
  }

  function renderFooter() {
    var list = document.getElementById("aio-footer");
    clear(list);
    var age = ageInDays(PAYLOAD.generated_at);
    [
      [t("footer.version"), textOr(PAYLOAD.tool_version)],
      [t("footer.mode"), textOr(PAYLOAD.mode)],
      [t("footer.generated"), textOr(PAYLOAD.generated_at)],
      [t("footer.age"), age === null ? t("footer.unknown") : String(age)]
    ].forEach(function (pair) {
      list.appendChild(h(
        "div",
        null,
        h("dt", null, pair[0]),
        h("dd", null, pair[1])
      ));
    });
  }

  function textOr(value) {
    return typeof value === "string" && value !== "" ? value : t("footer.unknown");
  }

  /* Failure ----------------------------------------------------------- */

  /* Design spec section 1.1: a payload that cannot be read never falls
     through to a partial render. The panels are removed, not hidden, so
     there is nothing stale left on screen to mistake for data. */
  function fatal(message) {
    var main = document.getElementById("aio-main");
    clear(main);
    main.appendChild(statusBlock("error", message));
    var nav = document.getElementById("aio-nav");
    if (nav) { nav.hidden = true; }
    var footer = document.getElementById("aio-footer");
    if (footer) { clear(footer); }
  }

  function readIsland(id) {
    var node = document.getElementById(id);
    if (!node) { throw new Error("island " + id + " is absent"); }
    return JSON.parse(node.textContent);
  }

  /* Boot -------------------------------------------------------------- */

  try {
    DICTS = readIsland("aio-i18n");
  } catch (err) {
    DICTS = null;
  }

  if (!DICTS || typeof DICTS !== "object" || !DICTS[FALLBACK_LANG]) {
    DICTS = null;
    fatal(LAST_RESORT);
    return;
  }

  applyDensity(currentDensity());
  LANG = resolveLang(parseHash().lang, null);
  document.documentElement.lang = LANG;

  var skip = document.getElementById("aio-skip");
  skip.textContent = t("action.skip_to_main");
  /* The href is a real fragment so the link works without scripting, but
     following it would rewrite the hash the router owns and silently reset
     the open panel, so the handler moves focus directly instead. */
  skip.addEventListener("click", function (event) {
    event.preventDefault();
    document.getElementById("aio-main").focus();
  });

  try {
    PAYLOAD = readIsland("aio-payload");
  } catch (err) {
    fatal(t("banner.parse_error"));
    return;
  }

  if (!PAYLOAD || typeof PAYLOAD !== "object" || Array.isArray(PAYLOAD)) {
    fatal(t("banner.parse_error"));
    return;
  }

  /* Forward compatibility: a payload written by a newer tool may mean
     anything, so an unknown schema is treated exactly like an unreadable
     one rather than being rendered on a guess. */
  if (PAYLOAD.payload_schema !== PAYLOAD_SCHEMA) {
    fatal(t("banner.schema_unknown"));
    return;
  }

  buildNav();
  window.addEventListener("hashchange", render);
  render();
}());
</script>

</body>
</html>
