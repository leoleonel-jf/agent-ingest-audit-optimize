     overview card ("the count below is missing"). A caller with no count
     below it -- the Rollback panel, whose own degraded copy names its own
     command instead -- passes its own key so the sentence matches where it
     actually appears. */
  function unavailableNoteKey(key, commandKey, degradedKey) {
    var computed = PAYLOAD.computed;
    if (computed && typeof computed === "object" && isError(computed[key])) {
      return degradedKey || "card.degraded";
    }
    return commandKey;
  }

  function listIndicator(values) {
    var count = Array.isArray(values) ? values.length : 0;
    return { count: count, severity: count === 0 ? "info" : "warning" };
  }

  function countActiveChanges() {
    return records("RUN").filter(function (record) {
      return !isRolledBack(record);
    }).length;
  }

  /* One reading of "this change is no longer in effect", used by the card
     that counts active changes and by the Changes panel that ranks them.
     The schema spells the two halves differently -- the record's `status`
     and the run's `result` -- and either alone is enough. Two copies of this
     test would eventually disagree, and the disagreement would show as a
     card counting one thing while the panel beneath it ranked another. */
  function isRolledBack(record) {
    return record.status === ROLLED_BACK_STATUS
      || record.result === ROLLED_BACK_RESULT;
  }

  /* A built page asks the filesystem; a static page cannot, but the ledger
     carries the status something recorded the last time it looked, and
     reporting that is honest in a way reporting zero would not be. */
  function unreachableProjects() {
    var listed = computedFor("unreachable_projects");
    if (Array.isArray(listed)) {
      return listed.filter(function (root) { return typeof root === "string"; });
    }
    var roots = [];
    ledgerList("known_projects").forEach(function (entry) {
      if (!entry || typeof entry !== "object") { return; }
      if (entry.status === "UNREACHABLE" && typeof entry.project_root === "string") {
        roots.push(entry.project_root);
      }
    });
    return roots;
  }

  /* Inventory ---------------------------------------------------------- */

  /* Every item every baseline recorded, one row each, filtered by kind.

     The `state` column carries two different facts and must not blur them.
     A baseline item's own `state` is scan-verified data -- what was on disk
     when the baseline was captured -- so it renders plainly. A drift state
     is a comparison this build performed just now, so it renders as a chip
     with its gloss and its severity. Neither is self-reported, and neither
     wears that marker; the SELF-REPORTED badge belongs to run records, which
     is Task 5's panel. */
  function renderInventory(section, state) {
    var drift = computedFor("drift");
    var kinds = [];
    var rows = [];

    ledgerList("baselines").forEach(function (entry) {
      if (!entry || typeof entry !== "object") { return; }
      var states = driftStatesFor(drift, entry.id);
      var items = Array.isArray(entry.items) ? entry.items : [];
      items.forEach(function (item) {
        if (!item || typeof item !== "object") { return; }
        if (typeof item.kind === "string" && kinds.indexOf(item.kind) === -1) {
          kinds.push(item.kind);
        }
        var found = states[itemKey(item)];
        rows.push({
          item: item,
          captured_on: typeof entry.captured_on === "string" ? entry.captured_on : null,
          drift: typeof found === "string" ? found : null
        });
      });
    });

    if (rows.length === 0) {
      section.appendChild(h("p", { class: "empty" }, t("panel.inventory.empty")));
      return;
    }

    kinds.sort();
    /* The kind buttons are a shortcut into the same one filter every other
       panel reads, not a filter of their own: pressing "skill" sets `f` to
       "skill", and the substring match below then does what an exact kind
       match used to. That is why an `f` this panel did not put there -- an
       anchor from the palette, say -- narrows this table too instead of
       being ignored: `f` means one thing across the whole page. */
    var visible = filterRows(rows, state.f, inventoryText);
    if (!appendFilters(
      section, state, "inventory", visible.length, rows.length, kinds, "filter.kind"
    )) {
      return;
    }

    var sorted = sortBySeverityThenRecency(visible, inventorySeverity);

    wide(section);
    section.appendChild(gridTable(
      "inventory.caption",
      [
        "table.kind", "table.name", "table.anchor",
        "table.state", "table.origin", "table.portable"
      ],
      sorted.map(inventoryRow)
    ));
  }

  function inventoryText(entry) {
    var item = entry.item;
    return searchText([
      item.kind, item.name, item.anchor, item.origin, item.state, entry.drift
    ]);
  }

  /* No drift report for this item means no claim about it, which is a note.
     A state that is there goes through `driftSeverityOf`, the one place the
     five states -- and anything that is not one of them -- are ranked. */
  function inventorySeverity(entry) {
    if (entry.drift === null) { return "info"; }
    return driftSeverityOf(entry.drift);
  }

  function inventoryRow(entry) {
    var item = entry.item;
    return tableRow(inventorySeverity(entry), false, [
      cell("table.kind", h("code", { lang: "en" }, textOrDash(item.kind))),
      cell("table.name", textOrDash(item.name)),
      cell("table.anchor", h("code", { class: "path" }, textOrDash(item.anchor))),
      cell("table.state", inventoryStateCell(entry)),
      cell("table.origin", h("code", { lang: "en" }, textOrDash(item.origin))),
      cell("table.portable", flagText(item.portable))
    ]);
  }

  function inventoryStateCell(entry) {
    if (entry.drift === null) {
      return h("code", { lang: "en" }, textOrDash(entry.item.state));
    }
    return vocabChip(
      entry.drift,
      inventorySeverity(entry),
      "state." + entry.drift + ".tip"
    );
  }

  /* The join. The drift report keeps one entry per baseline, each holding
     one row per item, and every row repeats the item's kind, name, and
     anchor -- which together identify an item inside its baseline. Joining
     on those three rather than on position means a report computed before
     the ledger gained an item still lines up, and a row that does not line
     up has no state at all rather than borrowing its neighbour's. */
  function driftStatesFor(report, baselineId) {
    var found = {};
    if (!report || typeof report !== "object") { return found; }
    var entries = Array.isArray(report.baselines) ? report.baselines : [];
    entries.forEach(function (entry) {
      if (!entry || typeof entry !== "object" || entry.id !== baselineId) { return; }
      var items = Array.isArray(entry.items) ? entry.items : [];
      items.forEach(function (item) {
        if (item && typeof item === "object") { found[itemKey(item)] = item.state; }
      });
    });
    return found;
  }

  function itemKey(item) {
    return [item.kind, item.name, item.anchor].join(SEPARATOR);
  }

  /* Changes ------------------------------------------------------------
     The run timeline. One block per RUN record, worst first and, within a
     severity, the one that moved last first -- the same ordering every other
     record panel uses, through the same function.

     What a block shows about a target is the digest recorded before it and
     the digest recorded after, plus the key that was written. That is the
     whole of the "inline before/after diff" at this version, and the panel
     says so in as many words: the ledger stores digests, not file bodies, so
     there is nothing here to diff and claiming otherwise would be inventing
     a guarantee. */

  function renderChanges(section, state) {
    var runs = records("RUN");
    if (runs.length === 0) {
      section.appendChild(h("p", { class: "empty" }, t("panel.changes.empty")));
      return;
    }
    var visible = filterRows(runs, state.f, runText);
    if (!appendFilters(
      section, state, "changes", visible.length, runs.length, null, null
    )) {
      return;
    }
    var drift = computedFor("drift");
    section.appendChild(h("p", { class: "note" }, t("changes.intro")));
    wide(section);
    sortBySeverityThenRecency(visible, runSeverity).forEach(function (record) {
      section.appendChild(runBlock(record, driftTargetStates(drift, record.id)));
    });
  }

  /* A run is searchable by everything the block shows about it in one line
     -- its id, its title, its result -- plus the anchors and keys it wrote,
     because "which change touched this file?" is the question this panel
     exists to answer and the file name is what the reader has. */
  function runText(record) {
    var values = [record.id, record.title, record.result, record.status];
    var targets = Array.isArray(record.targets) ? record.targets : [];
    targets.forEach(function (target) {
      if (!target || typeof target !== "object") { return; }
      values.push(target.anchor);
      values.push(target.key);
      values.push(target.kind);
    });
    return searchText(values);
  }

  /* A run's severity, in three branches and in this order.

     A run that was undone is history rather than a fault -- the reading
     `countActiveChanges` takes of the same two fields, through the same
     function, and the reading the Decisions panel takes of a SUPERSEDED
     record. Ranking it as a finding would float every rolled-back change
     above the live ones that actually describe the setup.

     A run that recorded a deviation from its plan is a finding: the plan is
     what was authorized, and a departure from it is the thing this panel
     exists to surface.

     So is any result but the one clean outcome. `VALIDATED` is the only one
     of the schema's six that says the change was applied, checked, and did
     what it claimed; the other five each name a way it did not. A missing or
     unrecognised result is a warning for the same reason an unknown drift
     state is: not knowing how a run ended is exactly where to look. */
  function runSeverity(record) {
    if (isRolledBack(record)) { return "info"; }
    if (deviationsOf(record).length !== 0) { return "warning"; }
    return record.result === CLEAN_RESULT ? "info" : "warning";
  }

  function deviationsOf(record) {
    var listed = record.deviations;
    if (!Array.isArray(listed)) { return []; }
    return listed.filter(function (value) {
      return typeof value === "string" && value !== "";
    });
  }

  function runBlock(record, states) {
    var severity = runSeverity(record);
    var block = h("div", { class: "run run-" + severity });
    block.appendChild(h(
      "h3",
      null,
      h("code", { lang: "en" }, textOrDash(record.id)),
      " ",
      textOrDash(record.title)
    ));
    block.appendChild(h(
      "p",
      { class: "note" },
      statusChip(record.status, "info"),
      " ",
      t("changes.result") + " ",
      resultChip(record.result, severity),
      " ",
      selfReportedBadge(record, "result"),
      " ",
      t("changes.proposal") + " ",
      h("code", { lang: "en" }, textOrDash(record.proposal)),
      " ",
      t("table.updated") + " " + textOrDash(record.updated),
      " ",
      t("changes.authorized") + " " + authorizedOn(record)
    ));
    var deviations = deviationsOf(record);
    if (deviations.length !== 0) {
      block.appendChild(h("h4", null, t("changes.deviations")));
      block.appendChild(h("ul", { class: "keys" }, deviations.map(function (line) {
        return h("li", null, line);
      })));
    }
    block.appendChild(h(
      "h4",
      null,
      t("changes.targets"),
      " ",
      selfReportedBadge(record, "targets")
    ));
    block.appendChild(targetsTable(record, states));
    var leftover = selfReportedLeftover(record, ["result", "targets"]);
    if (leftover !== null) { block.appendChild(leftover); }
    /* Export only. A run's own instruction is "roll it back", and that one
       belongs to the Rollback panel, behind the confirmation -- offering it
       here as one button among several is precisely the casual reach the
       two-step exists to prevent. */
    block.appendChild(recordActions(null, record));
    return block;
  }

  function authorizedOn(record) {
    var authorization = record.authorization;
    if (!authorization || typeof authorization !== "object") {
      return t("value.unknown");
    }
    return textOrDash(authorization.recorded_on);
  }

  /* The state column exists only when a drift report classified this run's
     targets. A column of "not recorded" would be worse than no column: it
     reads as "the ledger left it blank" when the truth is that this page
     never compared anything against disk. */
  function targetsTable(record, states) {
    var targets = Array.isArray(record.targets) ? record.targets : [];
    var headers = ["table.anchor", "table.kind", "table.key"];
    if (states !== null) { headers.push("table.state"); }
    headers = headers.concat([
      "table.before", "table.after", "table.reversible", "table.residual"
    ]);
    return gridTable("changes.caption", headers, targets.map(function (target) {
      return targetRow(target, states);
    }), textOrDash(record.id));
  }

  function targetRow(target, states) {
    var row = target && typeof target === "object" ? target : {};
    var state = states === null ? undefined : own(states, targetKey(row));
    var severity = typeof state === "string" ? driftSeverityOf(state) : "info";
    var cells = [
      cell("table.anchor", h("code", { class: "path" }, textOrDash(row.anchor))),
      cell("table.kind", h("code", { lang: "en" }, textOrDash(row.kind))),
      cell("table.key", h("code", { class: "path" }, textOrDash(row.key)))
    ];
    if (states !== null) {
      cells.push(cell("table.state", typeof state === "string"
        ? vocabChip(state, severity, "state." + state + ".tip")
        : t("value.unknown")));
    }
    cells.push(cell("table.before", digestCell(row.before_digest)));
    cells.push(cell("table.after", digestCell(row.after_digest)));
    cells.push(cell("table.reversible", flagText(row.reversible)));
    cells.push(cell("table.residual", residualText(row.residual_effect)));
    return tableRow(severity, false, cells);
  }

  /* A recorded residual effect is prose the run wrote; its absence is not a
     gap in the record but a statement that undoing the change leaves nothing
     behind, so it reads "none" rather than "not recorded". */
  function residualText(value) {
    if (typeof value === "string" && value !== "") { return value; }
    if (value === null || value === undefined) { return t("value.none"); }
    return textOrDash(value);
  }

  /* The run-target half of the drift report, joined the way the baseline
     half is joined in `driftStatesFor`: on the fields that identify a target
     inside its run rather than on position, so a report computed before the
     run gained a target still lines up and a row that does not line up gets
     no state at all instead of its neighbour's.

     Null, not an empty map, when there is no report for this run: "nothing
     on this page compared anything" and "this report classified none of
     these targets" are different claims, and only the second may render a
     column of states. */
  function driftTargetStates(report, runId) {
    if (!report || typeof report !== "object") { return null; }
    var entries = Array.isArray(report.runs) ? report.runs : [];
    /* Object.create(null): the key is built from ledger content, and a
       target anchored at "constructor" would otherwise read back the
       inherited function instead of undefined. */
    var found = Object.create(null);
    var matched = false;
    entries.forEach(function (entry) {
      if (!entry || typeof entry !== "object" || entry.id !== runId) { return; }
      matched = true;
      var targets = Array.isArray(entry.targets) ? entry.targets : [];
      targets.forEach(function (target) {
        if (target && typeof target === "object") {
          found[targetKey(target)] = target.state;
        }
      });
    });
    return matched ? found : null;
  }

  function targetKey(target) {
    return [target.anchor, target.kind].join(SEPARATOR);
  }

  /* Provenance ----------------------------------------------------------
     The index the ledger does not keep. It records what each run touched;
     the question this panel answers is the other direction -- for one file,
     which runs touched it, and what evidence each of those runs rests on.

     Built here rather than by the build command on purpose: it is a view of
     the ledger and nothing else, so a static page owes exactly the same
     answer as a built one and gets it.

     One native `details` per target, which is keyboard-reachable, needs no
     ARIA, and costs no script. The print block unfolds them. */

  function renderProvenance(section, state) {
    var index = anchorIndex(records("RUN"));
    if (index.length === 0) {
      section.appendChild(h("p", { class: "empty" }, t("panel.provenance.empty")));
      return;
    }
    /* Built before the filter runs: `chainText` needs it to resolve each
       run's proposal, and a reader arriving from the palette is filtering
       on exactly that proposal's id or title (see `chainText` below). */
    var byId = recordIndex();
    var visible = filterRows(index, state.f, function (entry) {
      return chainText(entry, byId);
    });
    if (!appendFilters(
      section, state, "provenance", visible.length, index.length, null, null
    )) {
      return;
    }
    var expired = expiredEvidenceIndex();
    section.appendChild(h("p", { class: "note" }, t("provenance.intro")));
    section.appendChild(h("p", { class: "note" }, t("materials.source_is_text")));
    visible.forEach(function (entry) {
      section.appendChild(chainBlock(entry, byId, expired));
    });
  }

  /* The anchor and the key are the entry's identity, and the ids of the
     runs under it are what a reader arriving from the Changes panel has in
     hand. The palette also indexes each run's proposal -- both its id and,
     when the ledger still carries that record, its title -- because the
     one place a PROPOSAL id and title appear on screen is inside this
     chain (see `chainList`). Without them, choosing a PROPOSAL result from
     the palette wrote a filter this panel could never match: I1. */
  function chainText(entry, byId) {
    var values = [entry.anchor, entry.key];
    entry.runs.forEach(function (record) {
      values.push(record.id);
      values.push(record.title);
      values.push(record.proposal);
      var proposal = byId ? recordById(byId, record.proposal) : null;
      if (proposal !== null) { values.push(proposal.title); }
    });
    return searchText(values);
  }

  /* Anchor *and* key together are the identity: two runs writing two
     different keys inside one settings file made two different changes, and
     merging them would put one run's evidence under the other's edit.

     Each entry carries the date of the newest run that touched it under the
     name `recencyKey` reads, so the shared sort orders the anchors by the
     run that moved last. Severity is deliberately flat: an anchor is not a
     finding -- the runs listed under it are, and each of those carries its
     own severity in the Changes panel. */
  function anchorIndex(runs) {
    /* Object.create(null): both halves of the key are ledger content. */
    var found = Object.create(null);
    var order = [];
    runs.forEach(function (record) {
      var targets = Array.isArray(record.targets) ? record.targets : [];
      targets.forEach(function (target) {
        if (!target || typeof target !== "object") { return; }
        var anchor = typeof target.anchor === "string" ? target.anchor : "";
        var key = typeof target.key === "string" ? target.key : "";
        var id = [anchor, key].join(SEPARATOR);
        var entry = own(found, id);
        if (entry === undefined) {
          entry = { anchor: anchor, key: key, runs: [], updated: "" };
          found[id] = entry;
          order.push(entry);
        }
        if (entry.runs.indexOf(record) === -1) { entry.runs.push(record); }
        var when = recencyKey(record);
        if (when > entry.updated) { entry.updated = when; }
      });
    });
    order.forEach(function (entry) {
      entry.runs = sortBySeverityThenRecency(entry.runs, flatSeverity);
    });
    return sortBySeverityThenRecency(order, flatSeverity);
  }

  /* Recency only, for the two sorts whose rows are not findings. */
  function flatSeverity() {
    return "info";
  }

  /* Every record by id, for the hops the chain makes: a run names its
     proposal, a proposal names its materials, and neither carries the other
     record inline. Null-prototype because every one of those ids is ledger
     content. */
  function recordIndex() {
    var found = Object.create(null);
    ledgerList("records").forEach(function (record) {
      if (record && typeof record === "object" && typeof record.id === "string") {
        found[record.id] = record;
      }
    });
    return found;
  }

  function chainBlock(entry, byId, expired) {
    var body = h("div", { class: "chain-body" });
    entry.runs.forEach(function (record) {
      body.appendChild(h(
        "p",
        { class: "note" },
        h("code", { lang: "en" }, textOrDash(record.id)),
        " ",
        textOrDash(record.title),
        " ",
        textOrDash(record.updated)
      ));
      body.appendChild(chainList(record, byId, expired));
    });
    return h(
      "details",
      { class: "chain" },
      h(
        "summary",
        null,
        h(
          "code",
          { class: "path" },
          entry.anchor === "" ? t("value.unknown") : entry.anchor
        ),
        entry.key === "" ? null : [" ", h("code", { class: "path" }, entry.key)],
        " ",
        h(
          "span",
          { class: "note" },
          t("provenance.runs") + " " + String(entry.runs.length)
        )
      ),
      body
    );
  }

  function chainList(record, byId, expired) {
    var list = h("ul", { class: "chain-list" });
    var proposal = recordById(byId, record.proposal);
    /* The one place a PROPOSAL id is named on this page, and so the one
       place the `implement` template has a call site. */
    list.appendChild(h(
      "li",
      null,
      t("provenance.proposal") + " ",
      h("code", { lang: "en" }, textOrDash(record.proposal)),
      proposal === null ? null : " " + textOrDash(proposal.title),
      instructionActions("implement", record.proposal)
    ));
    var materials = materialIdsFor(record, proposal);
    if (materials.length === 0) {
      list.appendChild(h("li", null, t("provenance.no_material")));
      return list;
    }
    materials.forEach(function (id) {
      var material = recordById(byId, id);
      var item = h(
        "li",
        null,
        t("provenance.material") + " ",
        h("code", { lang: "en" }, id),
        material === null ? null : " " + textOrDash(material.title)
      );
      if (material !== null) {
        item.appendChild(evidenceList(material, expired));
      }
      list.appendChild(item);
    });
    return list;
  }

  function recordById(byId, id) {
    if (typeof id !== "string" || id === "") { return null; }
    var found = own(byId, id);
    return found === undefined ? null : found;
  }

  /* The chain design spec section 4 asks for is run → proposal → material,
     and the material link lives on the proposal. A run links its materials
     directly as well, and both are followed: a run recorded without a
     proposal, or a proposal edited after the run, would otherwise end the
     chain silently -- and a chain that stops without saying so is worse than
     no chain, because it reads as "this change rests on nothing". */
  function materialIdsFor(record, proposal) {
    var ids = [];
    [proposal, record].forEach(function (source) {
      linkedMaterials(source).forEach(function (id) {
        if (ids.indexOf(id) === -1) { ids.push(id); }
      });
    });
    return ids;
  }

  function linkedMaterials(record) {
    if (!record || typeof record !== "object") { return []; }
    var links = record.links;
    if (!links || typeof links !== "object") { return []; }
    var listed = links.materials;
    if (!Array.isArray(listed)) { return []; }
    return listed.filter(function (value) {
      return typeof value === "string" && value !== "";
    });
  }

  /* Rollback ------------------------------------------------------------
     One block per RUN that kept a backup: the indicator, what the recorded
     backup says versus what the preview recomputed, and design spec section
     11's four sets.

     All four sets are rendered every time, empty ones included. They
     partition the run's targets, so an empty one is a real answer -- and a
     panel that dropped it would make "nothing could be restored" and "this
     was never computed" look identical on screen.

     Runs with no backup are listed underneath, plainly: there is nothing to
     preview and nothing to restore from, and saying so is the only honest
     thing this panel can do about them. */

  function renderRollback(section, state) {
    var all = records("RUN");
    if (all.length === 0) {
      section.appendChild(h("p", { class: "empty" }, t("panel.rollback.empty")));
      return;
    }
    /* Filtered before the backup split, not after: the two lists below are
       two readings of the same set of runs, and a filter that reached only
       the first would leave the second naming runs the reader asked to
       hide. */
    var runs = filterRows(all, state.f, runText);
    if (!appendFilters(
      section, state, "rollback", runs.length, all.length, null, null
    )) {
      return;
    }
    var previews = computedFor("previews");
    var kept = runs.filter(hasBackup);
    var unbacked = runs.filter(function (record) { return !hasBackup(record); });

    if (previews === null) {
      /* Two different absences, told apart by the same helper the overview
         cards use: a static page is one command away from the preview, and
         a build whose previews failed is not. */
      section.appendChild(statusBlock(
        "warning",
        t(unavailableNoteKey("previews", "panel.rollback.empty", "rollback.degraded"))
      ));
    } else {
      section.appendChild(h("p", { class: "note" }, t("rollback.intro")));
    }

    sortBySeverityThenRecency(kept, function (record) {
      return previewSeverity(previewFor(previews, record.id));
    }).forEach(function (record) {
      section.appendChild(rollbackBlock(record, previewFor(previews, record.id)));
    });

    if (unbacked.length !== 0) {
      section.appendChild(h("h3", null, t("rollback.no_backup_heading")));
      section.appendChild(h("p", { class: "note" }, t("rollback.no_backup")));
      section.appendChild(h("ul", { class: "keys" }, unbacked.map(function (record) {
        return h(
          "li",
          null,
          h("code", { lang: "en" }, textOrDash(record.id)),
          " ",
          textOrDash(record.title)
        );
      })));
    }
  }

  function hasBackup(record) {
    return Boolean(record.backup) && typeof record.backup === "object";
  }

  function previewFor(previews, runId) {
    if (!previews || typeof previews !== "object") { return null; }
    var found = own(previews, runId);
    if (!found || typeof found !== "object" || isError(found)) { return null; }
    return found;
  }

  /* No preview is a warning rather than a note: a run that kept a backup and
     has no preview on this page is precisely the one nobody can promise
     anything about, so it sorts above the ones that verified. */
  function previewSeverity(preview) {
    if (preview === null) { return "warning"; }
    var severity = own(INDICATOR_SEVERITY, preview.indicator);
    return severity === undefined ? "warning" : severity;
  }

  function rollbackBlock(record, preview) {
    var severity = previewSeverity(preview);
    var block = h("div", { class: "run run-" + severity });
    block.appendChild(h(
      "h3",
      null,
      h("code", { lang: "en" }, textOrDash(record.id)),
      " ",
      textOrDash(record.title)
    ));
    block.appendChild(h(
      "p",
      { class: "note" },
      t("rollback.indicator") + " ",
      preview === null
        ? t("value.unknown")
        : vocabChip(
            preview.indicator,
            severity,
            "state." + preview.indicator + ".tip"
          ),
      " ",
      t("rollback.backup") + " ",
      backupCell(record, preview),
      " ",
      selfReportedBadge(record, "backup"),
      " ",
      t("rollback.tested") + " ",
      testedChip(record),
      " ",
      selfReportedBadge(record, "rollback.tested")
    ));
    if (preview === null) {
      block.appendChild(h("p", { class: "note" }, t("rollback.preview_missing")));
      block.appendChild(rollbackActions(record, preview));
      return block;
    }
    PREVIEW_SETS.forEach(function (key) {
      var meta = PREVIEW_SET_META[key];
      appendSet(block, meta.labelKey, preview[key], meta.withReason);
    });
    /* After the four sets, never before them: design spec section 12.2
       asks for the preview to be *displayed* before the copy is enabled,
       and a control the reader meets before the evidence is a control they
       decide about before they have read anything. */
    block.appendChild(rollbackActions(record, preview));
    return block;
  }

  /* Design spec section 12.2's two-step, built as three controls rather
     than a dialog: this page has no modal, needs none, and a modal would
     have to be dismissible -- which is another way to leave a control
     armed after the reader stopped paying attention.

     The copy and queue controls exist from the start, visibly inert and
     saying why, because a control that only appears after a click is a
     control the reader has to discover twice.

     `armed` is the guard; the `aria-disabled` attribute is only its
     appearance. The handlers refuse on the flag, so a stylesheet, an
     assistive technology that ignores the attribute, or a future edit that
     forgets to set it cannot reach the instruction. Nothing re-arms and
     nothing disarms silently: there is no blur handler, no timer, and no
     escape key here at all. A re-render -- leaving this panel and coming
     back -- rebuilds the block with `armed` false again, which is the safe
     direction for the state to reset in, and is why `renderQueue` refreshes
     the drawer in place instead of calling `render`. */
  function rollbackActions(record, preview) {
    var group = h("div", {
      class: "actions-row",
      role: "group",
      "aria-label": t("rollback.actions")
    });
    var instruction = instructionFor("rollback", record.id);
    if (instruction === null) {
      if (preview !== null) { group.appendChild(exportButton(preview)); }
      return group;
    }
    var armed = false;
    var copy = h(
      "button",
      { type: "button", class: "action", "aria-disabled": "true" },
      t("rollback.copy")
    );
    var queue = h(
      "button",
      { type: "button", class: "action", "aria-disabled": "true" },
      t("action.queue_add")
    );
    var agree = h(
      "button",
      { type: "button", class: "action confirm" },
      t("rollback.confirm")
    );
    var step = h(
      "div",
      { class: "confirm-step" },
      h(
        "p",
        { class: "note" },
        t("rollback.confirm_prompt") + " ",
        h("code", { lang: "en" }, textOrDash(record.id))
      ),
      agree
    );
    step.hidden = true;
    var prepare = actionButton("rollback.prepare", function () {
      step.hidden = false;
      announce(t("rollback.confirm_prompt"));
    });
    agree.addEventListener("click", function () {
      armed = true;
      copy.setAttribute("aria-disabled", "false");
      queue.setAttribute("aria-disabled", "false");
      announce(t("rollback.armed"));
    });
    copy.addEventListener("click", function () {
      if (!armed) { announce(t("rollback.locked")); return; }
      copyText(instruction);
    });
    queue.addEventListener("click", function () {
      if (!armed) { announce(t("rollback.locked")); return; }
      enqueue("rollback", instruction);
    });
    group.appendChild(prepare);
    group.appendChild(copy);
    group.appendChild(queue);
    if (preview !== null) { group.appendChild(exportButton(preview)); }
    group.appendChild(step);
    return group;
  }

  /* Two different facts about one backup, and blurring them would be the
     whole point of the badge lost. The run's own `backup.verified` is the
     run's claim, which is why it carries the SELF-REPORTED badge when the
     run lists the field; the preview's is what `rollback-preview`
     recomputed against the file. The recomputed answer wins whenever it is
     on the page, and its reason is shown beside it, because "not verified"
     and "not verified because the backup is missing" ask for different
     next steps. */
  function backupCell(record, preview) {
    var reported = record.backup && typeof record.backup === "object"
      ? record.backup.verified
      : null;
    var computed = preview && preview.backup && typeof preview.backup === "object"
      ? preview.backup
      : null;
    if (computed === null) { return flagText(reported); }
    var reason = computed.reason;
    if (typeof reason !== "string" || reason === "") {
      return flagText(computed.verified);
    }
    return [
      flagText(computed.verified),
      " ",
      h("code", { lang: "en" }, reason)
    ];
  }

  function testedChip(record) {
    var rollback = record.rollback;
    var value = rollback && typeof rollback === "object" ? rollback.tested : null;
    if (typeof value !== "string" || value === "") { return t("value.unknown"); }
    var severity = own(TESTED_SEVERITY, value);
    return vocabChip(
      value,
      severity === undefined ? "warning" : severity,
      "rollback.tested." + value + ".tip"
    );
  }

  /* The heading is appended before the list is looked at, which is the whole
     rule: four headings, always, whatever the sets hold. An empty set says
     "none" -- a real answer -- rather than vanishing. */
  function appendSet(block, labelKey, rows, withReason) {
    block.appendChild(h("h4", null, t(labelKey)));
    var listed = Array.isArray(rows) ? rows : [];
    if (listed.length === 0) {
      block.appendChild(h("p", { class: "note" }, t("value.none")));
      return;
    }
    block.appendChild(h("ul", { class: "keys" }, listed.map(function (row) {
      return h("li", null, setRow(row, withReason));
    })));
  }

  /* Three shapes reach here. `residual_effects` holds the target's recorded
     effect verbatim, which is prose; the other three sets hold target rows.
     Anything else is reported as unrecorded rather than stringified into
     something that looks like data. */
  function setRow(row, withReason) {
    if (typeof row === "string" && row !== "") { return row; }
    if (!row || typeof row !== "object") { return t("value.unknown"); }
    return [
      h("code", { class: "path" }, textOrDash(row.anchor)),
      " ",
      h("code", { lang: "en" }, textOrDash(row.kind)),
      withReason && typeof row.reason === "string" && row.reason !== ""
        ? [
            " ",
            h("span", { class: "note" }, t("table.reason") + " "),
            h("code", { lang: "en" }, row.reason)
          ]
        : null
    ];
  }

  /* Backlog ------------------------------------------------------------ */

  function renderBacklog(section, state) {
    var all = ledgerList("backlog").filter(function (entry) {
      return Boolean(entry) && typeof entry === "object";
    });
    if (all.length === 0) {
      section.appendChild(h("p", { class: "empty" }, t("panel.backlog.empty")));
      return;
    }
    var entries = filterRows(all, state.f, backlogText);
    if (!appendFilters(
      section, state, "backlog", entries.length, all.length, null, null
    )) {
      return;
    }
    var today = todayISO();
    var sorted = sortBySeverityThenRecency(entries, function (entry) {
      return backlogSeverity(entry, today);
    });
    wide(section);
    section.appendChild(gridTable(
      "backlog.caption",
      [
        "table.record", "table.classification", "table.reason",
        "table.revisit", "table.actions"
      ],
      sorted.map(function (entry) { return backlogRow(entry, today); })
    ));
  }

  function backlogText(entry) {
    return searchText([
      entry.id, entry.classification, entry.reason, entry.revisit_trigger
    ]);
  }

  /* A revisit date that has passed is the backlog's only finding: the entry
     asked to be looked at again by then and nobody has. Everything else here
     is a note -- a deferred finding is not a fault. */
  function backlogSeverity(entry, today) {
    var when = entry.revisit_after;
    if (typeof when === "string" && when !== "" && when < today) { return "warning"; }
    return "info";
  }

  function backlogRow(entry, today) {
    var severity = backlogSeverity(entry, today);
    var revisit = [];
    if (typeof entry.revisit_trigger === "string" && entry.revisit_trigger !== "") {
      revisit.push(h("p", { class: "note" }, entry.revisit_trigger));
    }
    if (typeof entry.revisit_after === "string" && entry.revisit_after !== "") {
      revisit.push(h("p", { class: "note" }, entry.revisit_after));
      if (severity === "warning") { revisit.push(marker("backlog.revisit_due")); }
    } else {
      revisit.push(h("p", { class: "note" }, t("backlog.trigger_only")));
    }
    return tableRow(severity, false, [
      cell("table.record", h("code", { lang: "en" }, textOrDash(entry.id))),
      cell("table.classification", classificationChip(entry.classification, severity)),
      cell("table.reason", textOrDash(entry.reason)),
      cell("table.revisit", revisit),
      /* A backlog entry's id is the record it defers, so the instruction is
         "revisit it". An entry whose id `ID_RE` refuses gets the export and
         nothing else -- see `instructionActions`. */
      cell("table.actions", recordActions("revisit", entry))
    ]);
  }

  /* Decisions ---------------------------------------------------------- */

  /* Design spec section 4: ADR records are never filtered out of this panel,
     only sorted. The fragment's filter therefore does not hide anything
     here -- it lifts what it matches to the top, which is what a
     "superseded by" link needs to do without making the rest disappear.

     This is the one panel that reads `f` differently from the other six, so
     it is also the one panel that has to say so: the chip would otherwise
     promise a filter, the table would show every row, and the reader would
     reasonably conclude the filter was broken. The count reported is the
     number of matches lifted, and `filter.never_hidden` is the sentence
     that explains why the rest are still there. */
  function renderDecisions(section, state) {
    var adrs = records("ADR");
    if (adrs.length === 0) {
      section.appendChild(h("p", { class: "empty" }, t("panel.decisions.empty")));
      return;
    }
    /* Empty rather than "everything" when no filter is on: `filterRows`
       hands back the whole list for an empty needle, and every row counting
       as a match would put every decision in the focused half of the sort
       -- which is the same order with a heavier border on all of it. */
    var matched = state.f === "" ? [] : filterRows(adrs, state.f, decisionText);
    appendAll(section, [panelFilters(
      state, "decisions", matched.length, adrs.length, null, null
    )]);
    if (state.f !== "") {
      section.appendChild(h("p", { class: "note" }, t("filter.never_hidden")));
    }
    var replaced = supersessionIndex(adrs);
    /* Every ADR is a note, a superseded one included: a decision that was
       replaced is history, not a fault, and giving it a warning would float
       it above live decisions in a sort that means severity. Recency is what
       separates them, and that is this sort's second key. */
    var sorted = sortBySeverityThenRecency(adrs, function () { return "info"; });
    var focused = [];
    var rest = [];
    sorted.forEach(function (record) {
      /* Substring rather than an id equality, so the same `f` a palette
         link or another panel's chip carries lifts the decision it names
         here too -- an exact-id focus would have answered a search for a
         title with no focus at all. */
      if (matched.indexOf(record) !== -1) { focused.push(record); return; }
      rest.push(record);
    });
    wide(section);
    section.appendChild(gridTable(
      "decisions.caption",
      [
        "table.record", "table.title", "table.status",
        "table.updated", "table.links", "table.actions"
      ],
      focused.concat(rest).map(function (record) {
        return decisionRow(record, replaced, focused.indexOf(record) !== -1);
      })
    ));
  }

  function decisionText(record) {
    return searchText([record.id, record.title, record.status]);
  }

  /* Which record replaced which. A record whose own status is SUPERSEDED
     names its replacement in links.adrs; the reverse direction has to be
     built here rather than read, because the replacement itself records
     nothing about what it displaced. */
  function supersessionIndex(adrs) {
    /* Object.create(null): `other` is a ledger-supplied ADR id, and a value
       of "constructor" on a plain `{}` would read back the inherited
       Function rather than undefined -- `!index[other]` would then be
       false, skipping the array, and `index[other].push` would throw on a
       function that has no such method. A null-prototype object has no
       inherited names to collide with. */
    var index = Object.create(null);
    adrs.forEach(function (record) {
      if (record.status !== "SUPERSEDED") { return; }
      linkedAdrs(record).forEach(function (other) {
        if (!index[other]) { index[other] = []; }
        index[other].push(record.id);
      });
    });
    return index;
  }

  function linkedAdrs(record) {
    var links = record.links;
    if (!links || typeof links !== "object") { return []; }
    var listed = links.adrs;
    if (!Array.isArray(listed)) { return []; }
    return listed.filter(function (value) {
      return typeof value === "string" && value !== "";
    });
  }

  function decisionRow(record, replaced, focused) {
    var links = [];
    if (record.status === "SUPERSEDED") {
      linkedAdrs(record).forEach(function (other) {
        links.push(h(
          "p",
          { class: "note" },
          t("decisions.superseded_by") + " ",
          recordLink(other)
        ));
      });
    }
    /* `replaced` is already a null-prototype map (see supersessionIndex), so
       a ledger record id of "toString" reads back undefined here rather than
       Object.prototype.toString -- but the array check stays explicit rather
       than resting on that alone, since a plain object arriving here from
       any future caller would otherwise hand this `.forEach` a function
       instead of a list. */
    (Array.isArray(replaced[record.id]) ? replaced[record.id] : []).forEach(function (other) {
      links.push(h(
        "p",
        { class: "note" },
        t("decisions.supersedes") + " ",
        recordLink(other)
      ));
    });
    return tableRow("info", focused, [
      cell("table.record", h("code", { lang: "en" }, textOrDash(record.id))),
      cell("table.title", textOrDash(record.title)),
      cell("table.status", statusChip(record.status, "info")),
      cell("table.updated", textOrDash(record.updated)),
      cell("table.links", links.length === 0 ? t("value.unknown") : links),
      /* Export only. None of the four templates addresses a decision: an
         ADR is a record of a choice already made, and "re-audit" or
         "revisit" would each say something about it this page has no
         grounds to say. */
      cell("table.actions", recordActions(null, record))
    ]);
  }

  /* An in-page link and nothing else: it names this panel and one record, so
     following it lifts that record to the top of this same table. safeHref
     sees a fragment and passes it through; there is no other shape a record
     link can take on this page. */
  function recordLink(other) {
    return h(
      "a",
      { href: "#panel=decisions&f=" + encodeURIComponent(other), lang: "en" },
      h("code", null, other)
    );
  }

  /* Materials ---------------------------------------------------------- */

  function renderMaterials(section, state) {
    var all = records("MATERIAL");
    if (all.length === 0) {
      section.appendChild(h("p", { class: "empty" }, t("panel.materials.empty")));
      return;
    }
    var materials = filterRows(all, state.f, materialText);
    if (!appendFilters(
      section, state, "materials", materials.length, all.length, null, null
    )) {
      return;
    }
    var expired = expiredEvidenceIndex();
    var sorted = sortBySeverityThenRecency(materials, function (record) {
      return materialSeverity(record, expired);
    });
    section.appendChild(h("p", { class: "note" }, t("materials.source_is_text")));
    if (expired === null) {
      section.appendChild(h("p", { class: "note" }, t("materials.expiry_unchecked")));
    }
    wide(section);
    section.appendChild(gridTable(
      "materials.caption",
      [
        "table.record", "table.title", "table.status",
        "table.classification", "table.evidence", "table.actions"
      ],
      sorted.map(function (record) { return materialRow(record, expired); })
    ));
  }

  function materialText(record) {
    var values = [record.id, record.title, record.status, record.classification];
    evidenceOf(record).forEach(function (item) {
      if (item && typeof item === "object") { values.push(item.source); }
    });
    return searchText(values);
  }

  /* Expiry is a comparison the build made against the date it ran, and this
     page does not redo it: recomputing at view time would answer a different
     question from the one dashboard.py answered and then quietly disagree
     with the command. Null means the comparison is not on this page at all,
     which the panel states in words rather than by showing every entry as
     current. */
  function expiredEvidenceIndex() {
    var listed = computedFor("expired_evidence");
    if (!Array.isArray(listed)) { return null; }
    var found = {};
    listed.forEach(function (entry) {
      if (entry && typeof entry === "object") {
        found[evidenceKey(entry.record, entry.source)] = true;
      }
    });
    return found;
  }

  function evidenceKey(recordId, source) {
    return [recordId, source].join(SEPARATOR);
  }

  function evidenceOf(record) {
    var listed = record.evidence;
    if (!Array.isArray(listed)) { return []; }
    return listed.filter(function (item) {
      return Boolean(item) && typeof item === "object";
    });
  }

  function isExpiredEvidence(record, item, expired) {
    if (expired === null) { return false; }
    return Boolean(expired[evidenceKey(record.id, item.source)]);
  }

  function materialSeverity(record, expired) {
    var severity = "info";
    evidenceOf(record).forEach(function (item) {
      if (isExpiredEvidence(record, item, expired)) { severity = "warning"; }
    });
    return severity;
  }

  /* One evidence list, built here rather than twice: the Materials panel
     shows a material's evidence under the material, and the Provenance panel
     shows the same evidence at the end of a chain. Two copies would
     eventually disagree about which dates are shown or which entry is
     marked expired, and the two panels would then describe the same evidence
     differently on the same page. */
  function evidenceList(record, expired) {
    var list = h("ul", { class: "evidence" });
    evidenceOf(record).forEach(function (item) {
      list.appendChild(h(
        "li",
        null,
        /* Design spec section 1.3: an evidence source is text. It is
           frequently an address, and it is never made clickable -- this page
           issues no request, and a live source would be one waiting to
           happen. Rendering it as text also keeps it copyable, which is what
           a reader chasing the claim actually needs. */
        h("span", { class: "source" }, textOrDash(item.source)),
        " ",
        h("span", { class: "note" }, textOrDash(item.kind)),
        " ",
        h(
          "span",
          { class: "note" },
          t("materials.verified_on") + " " + textOrDash(item.verified_on)
        ),
        typeof item.expires_on === "string" && item.expires_on !== ""
          ? h(
              "span",
              { class: "note" },
              " " + t("materials.expires_on") + " " + item.expires_on
            )
          : null,
        isExpiredEvidence(record, item, expired) ? marker("materials.expired") : null
      ));
    });
    return list;
  }

  function materialRow(record, expired) {
    var list = evidenceList(record, expired);
    return tableRow(materialSeverity(record, expired), false, [
      cell("table.record", h("code", { lang: "en" }, textOrDash(record.id))),
      cell("table.title", textOrDash(record.title)),
      cell("table.status", statusChip(record.status, "info")),
      cell("table.classification", classificationChip(record.classification, "info")),
      cell(
        "table.evidence",
        evidenceOf(record).length === 0 ? t("value.unknown") : list
      ),
      cell("table.actions", recordActions("audit", record))
    ]);
  }

  /* Design spec section 14: a sub-computation that failed carries an error
     message instead of a report, and the panel that depends on it must name
     the missing guarantee rather than render a blank that reads as "none". */
  function degradedKeys() {
    var computed = PAYLOAD.computed;
    if (!computed || typeof computed !== "object") { return []; }
    var names = [];
    ["drift", "previews", "expired_evidence", "unreachable_projects"].forEach(function (key) {
      if (isError(computed[key])) { names.push("computed." + key); }
    });
    var previews = computed.previews;
    if (previews && typeof previews === "object" && !isError(previews)) {
      Object.keys(previews).forEach(function (runId) {
        if (isError(previews[runId])) { names.push("computed.previews." + runId); }
      });
    }
    return names;
  }

  function isError(value) {
    return Boolean(value) && typeof value === "object" && typeof value.error === "string";
  }

  /* The Help panel needs no payload: it is dictionary content, so it is
     already final. The canonical state names render as English text with
     their translated gloss beside them -- the gloss is also the tooltip the
     Task 4-5 renderers attach to the same label inline. */
  function renderHelp(section) {
    section.appendChild(h("p", { class: "empty" }, t("panel.help.empty")));
    section.appendChild(h("p", { class: "empty" }, t("help.modes")));
    section.appendChild(h("p", { class: "empty" }, t("help.self_reported")));
    section.appendChild(h("p", { class: "empty" }, t("help.canonical_labels")));
    /* Why every instruction on this page is in English even when the page
       is not. Said here rather than beside each button: it is one rule
       about the whole action model, and repeating it on every row would
       make it furniture. */
    section.appendChild(h("p", { class: "empty" }, t("action.instructions_are_english")));

    section.appendChild(h("h3", null, t("help.states")));
    section.appendChild(glossary(
      DRIFT_STATES.concat(ROLLBACK_INDICATORS),
      function (name) { return "state." + name + ".tip"; }
    ));

    section.appendChild(h("h3", null, t("help.classifications")));
    section.appendChild(glossary(
      CLASSIFICATIONS,
      function (name) { return "vocab.class." + name + ".tip"; }
    ));

    section.appendChild(h("h3", null, t("help.statuses")));
    section.appendChild(glossary(
      RECORD_STATUSES,
      function (name) { return "vocab.status." + name + ".tip"; }
    ));

    /* A record's status and a run's result are different words for
       different facts -- one says where the record stands, the other says
       how the run ended -- and the Changes panel shows both side by side.
       Glossing only one of them here would leave the reader to guess which
       of the two chips they were looking at. */
    section.appendChild(h("h3", null, t("help.results")));
    section.appendChild(glossary(
      RUN_RESULTS,
      function (name) { return "vocab.result." + name + ".tip"; }
    ));

    /* Commands, not prose: the entries stay English while their one-line
       descriptions are translated, for the reason help.canonical_labels
       states -- a translated command is a command that does not run. */
    section.appendChild(h("h3", null, t("help.commands")));
    var commands = h("dl", { class: "reference" });
    COMMANDS.forEach(function (pair) {
      commands.appendChild(h("dt", null, h("code", { lang: "en" }, pair[0])));
      commands.appendChild(h("dd", null, t(pair[1])));
    });
    section.appendChild(commands);
  }

  /* The same two-column shape for all three vocabularies: the canonical
     English term, and its gloss both beside it and as its tooltip -- which
     is the same string the record panels attach to the same term inline. */
  function glossary(names, keyFor) {
    var list = h("dl", { class: "reference" });
    names.forEach(function (name) {
      var tip = t(keyFor(name));
      list.appendChild(h("dt", null, h("code", { lang: "en", title: tip }, name)));
      list.appendChild(h("dd", null, tip));
    });
    return list;
  }

  /* Design spec section 4's staleness deviation: a file: page cannot stat
     the ledger without issuing a request, so the page reports when it was
     generated and how long ago that was, and says plainly that a static
     page shows whatever was last injected. Date.now() at view time is fine
     here -- this is presentation, not evidence. */
  function ageInDays(value) {
    if (typeof value !== "string" || value === "") { return null; }
    var when = Date.parse(value);
    if (isNaN(when)) { return null; }
    return Math.floor((Date.now() - when) / DAY_MS);
  }

  function renderFooter() {
    var list = document.getElementById("aio-footer");
    clear(list);
    var age = ageInDays(PAYLOAD.generated_at);
    [
      [t("footer.version"), textOr(PAYLOAD.tool_version)],
      [t("footer.mode"), textOr(PAYLOAD.mode)],
      [t("footer.generated"), textOr(PAYLOAD.generated_at)],
      [t("footer.age"), age === null ? t("footer.unknown") : String(age)]
    ].forEach(function (pair) {
      list.appendChild(h(
        "div",
        null,
        h("dt", null, pair[0]),
        h("dd", null, pair[1])
      ));
    });
  }

  function textOr(value) {
    return typeof value === "string" && value !== "" ? value : t("footer.unknown");
  }

  /* Failure ----------------------------------------------------------- */

  /* Design spec section 1.1: a payload that cannot be read never falls
     through to a partial render. The panels are removed, not hidden, so
     there is nothing stale left on screen to mistake for data. */
  function fatal(message) {
    var main = document.getElementById("aio-main");
    clear(main);
    main.appendChild(statusBlock("error", message));
    var nav = document.getElementById("aio-nav");
    if (nav) { nav.hidden = true; }
    var footer = document.getElementById("aio-footer");
    if (footer) { clear(footer); }
  }

  function readIsland(id) {
    var node = document.getElementById(id);
    if (!node) { throw new Error("island " + id + " is absent"); }
    return JSON.parse(node.textContent);
  }

  /* Boot -------------------------------------------------------------- */

  try {
    DICTS = readIsland("aio-i18n");
  } catch (err) {
    DICTS = null;
  }

  if (!DICTS || typeof DICTS !== "object" || !DICTS[FALLBACK_LANG]) {
    DICTS = null;
    fatal(LAST_RESORT);
    return;
  }

  applyDensity(currentDensity());
  LANG = resolveLang(parseHash().lang, null);
  document.documentElement.lang = LANG;

  var skip = document.getElementById("aio-skip");
  skip.textContent = t("action.skip_to_main");
  /* The href is a real fragment so the link works without scripting, but
     following it would rewrite the hash the router owns and silently reset
     the open panel, so the handler moves focus directly instead. */
  skip.addEventListener("click", function (event) {
    event.preventDefault();
    document.getElementById("aio-main").focus();
  });

  try {
    PAYLOAD = readIsland("aio-payload");
  } catch (err) {
    fatal(t("banner.parse_error"));
    return;
  }

  if (!PAYLOAD || typeof PAYLOAD !== "object" || Array.isArray(PAYLOAD)) {
    fatal(t("banner.parse_error"));
    return;
  }

  /* Forward compatibility: a payload written by a newer tool may mean
     anything, so an unknown schema is treated exactly like an unreadable
     one rather than being rendered on a guess. */
  if (PAYLOAD.payload_schema !== PAYLOAD_SCHEMA) {
    fatal(t("banner.schema_unknown"));
    return;
  }

  buildNav();
  wirePalette();
  window.addEventListener("hashchange", render);
  render();
}());
</script>

</body>
</html>
